    var today = todayStr();
    var html = '';
    for (var i = firstDow - 1; i >= 0; i--) {
      html += '<button type="button" class="cal-day" disabled>' + (prevDim - i) + '</button>';
    }
    for (var d = 1; d <= dim; d++) {
      var dateStr = y + '-' + pad2(m) + '-' + pad2(d);
      var dow = new Date(y, m - 1, d).getDay();
      var cls = 'cal-day';
      if (dow === 0) cls += ' sun';
      else if (dow === 6) cls += ' sat';
      if (dateStr === today) cls += ' today';
      html += '<button type="button" class="' + cls + '" data-date="' + dateStr + '">' + d + '</button>';
    }
    var trailing = (7 - (firstDow + dim) % 7) % 7;
    for (var j = 1; j <= trailing; j++) {
      html += '<button type="button" class="cal-day" disabled>' + j + '</button>';
    }
    calGrid.innerHTML = html;
  }
  function openCalendar() {
    calViewMonth = currentMonthKey();
    renderCalendar();
    calModal.hidden = false;
  }
  function closeCalendar() { calModal.hidden = true; }
  customDateBtn.addEventListener('click', openCalendar);
  calModal.addEventListener('click', function(e) {
    if (e.target === calModal) { closeCalendar(); return; }
    var nav = e.target.closest('.cal-nav');
    if (nav) {
      calViewMonth = shiftMonth(calViewMonth, parseInt(nav.dataset.nav, 10));
      renderCalendar();
      return;
    }
    var day = e.target.closest('.cal-day[data-date]');
    if (day) {
      var dateStr = day.dataset.date;
      var label;
      if (dateStr === todayStr()) label = '오늘';
      else if (dateStr === offsetDate(-1)) label = '어제';
      else if (dateStr === offsetDate(-2)) label = '그제';
      else {
        var pp = dateStr.split('-');
        label = parseInt(pp[1], 10) + '월 ' + parseInt(pp[2], 10) + '일';
      }
      applyQuickDate(label);
      closeCalendar();
    }
  });

  txListEl.addEventListener('click', function(e) {
    if (!e.target.dataset || e.target.dataset.action !== 'delete-tx') return;
    var txEl = e.target.closest('.tx');
    if (!txEl) return;
    handleDeleteTx(parseInt(txEl.dataset.txId, 10));
  });

  navPrev.addEventListener('click', function() {
    viewMonth = shiftMonth(viewMonth, -1);
    renderStats();
  });
  navNext.addEventListener('click', function() {
    var next = shiftMonth(viewMonth, 1);
    if (next > currentMonthKey()) return;
    viewMonth = next;
    renderStats();
  });
  weeksEl.addEventListener('click', function(e) {
    var weekEl = e.target.closest('.week');
    if (!weekEl) return;
    weekEl.classList.toggle('collapsed');
  });

  titleEl.addEventListener('click', showHome);
  statsBtn.addEventListener('click', function() {
    if (!screenStats.hidden) showHome();
    else showStats();
  });
  settingsBtn.addEventListener('click', function() {
    if (!screenSettings.hidden) showHome();
    else showSettingsScreen();
  });
  backBtnStats.addEventListener('click', showHome);
  backBtnSettings.addEventListener('click', showHome);

  function bindLimitInput(input, field) {
    input.addEventListener('blur', function() { handleLimitChange(field, input.value); });
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    });
  }
  bindLimitInput(weekLimitInput, 'weekLimit');

  // 한도 추적 카드 (동적 render) — delegated events
  budgetTrackingHost.addEventListener('change', function(e) {
    if (e.target.matches('select[name="budgetCategoryId"]')) {
      handleBudgetCatChange(e.target.value);
    }
  });
  budgetTrackingHost.addEventListener('blur', function(e) {
    if (e.target.matches('input[name="monthLimit"]')) {
      handleLimitChange('monthLimit', e.target.value);
      renderBudgetTracking();
    }
  }, true);
  budgetTrackingHost.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.target.matches('input[name="monthLimit"]')) {
      e.preventDefault();
      e.target.blur();
    }
  });

  function refreshSummaryLine(catEl, cat) {
    var emojiEl = catEl.querySelector('.sum-emoji');
    var nameEl = catEl.querySelector('.sum-name');
    var metaEl = catEl.querySelector('.sum-meta');
    if (emojiEl) {
      if (cat.emoji) {
        emojiEl.textContent = cat.emoji;
        emojiEl.classList.remove('empty');
      } else {
        emojiEl.textContent = '🔖';
        emojiEl.classList.add('empty');
      }
    }
    if (nameEl) nameEl.textContent = cat.name;
    if (metaEl) {
      var kwCount = (cat.keywords || []).length;
      var kwText = kwCount > 0 ? '키워드 ' + kwCount + '개' : '키워드 없음';
      metaEl.textContent = (cat.budget > 0 ? formatMoney(cat.budget) : '예산 0') + ' · ' + kwText;
    }
  }

  function handleSettingsListChange(target) {
    if (!target) return;
    var catEl = target.closest('.settings-cat');
    if (!catEl) return;
    var id = parseInt(catEl.dataset.catId, 10);
    var cat = getCategoryById(id);
    if (!cat) return;

    if (target.tagName === 'INPUT') {
      if (target.classList.contains('emoji-input')) {
        handleSettingsCatChange(id, 'emoji', target.value);
      } else if (target.classList.contains('name-input')) {
        handleSettingsCatChange(id, 'name', target.value);
        if (!target.value.trim()) target.value = cat.name;
      } else if (target.classList.contains('kw-input')) {
        handleSettingsCatChange(id, 'keywords', target.value);
      } else if (target.classList.contains('budget-input')) {
        handleSettingsCatChange(id, 'budget', target.value);
        target.value = cat.budget;
        // 한도 추적 카테고리 budget 변경되면 한도 추적 카드도 다시 그림
        if (id === state.meta.budgetCategoryId) {
          renderBudgetTracking();
        }
      }
      refreshSummaryLine(catEl, cat);
    } else if (target.tagName === 'SELECT' && target.classList.contains('parent-select')) {
      handleSettingsCatChange(id, 'parent', target.value);
      // 부모 변경 시 트리 구조 다시 그려야 함
      renderSettings();
    }
  }

  settingsCatListEl.addEventListener('blur', function(e) {
    handleSettingsListChange(e.target);
  }, true);
  settingsCatListEl.addEventListener('change', function(e) {
    if (e.target.tagName === 'SELECT') handleSettingsListChange(e.target);
  });
  settingsCatListEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
      e.preventDefault();
      e.target.blur();
    }
  });
  settingsCatListEl.addEventListener('click', function(e) {
    // 이모지 input 클릭 → picker 열기
    if (e.target.classList.contains('emoji-input')) {
      e.preventDefault();
      openEmojiPicker(e.target);
      return;
    }
    if (e.target.classList.contains('settings-cat-delete')) {
      var delEl = e.target.closest('.settings-cat');
      if (!delEl) return;
      handleDeleteCategory(parseInt(delEl.dataset.catId, 10));
      return;
    }
    if (e.target.closest('input') || e.target.closest('button') || e.target.closest('select')) return;
    var summary = e.target.closest('.cat-summary-line');
    if (!summary) return;
    var catEl = summary.closest('.settings-cat');
    if (!catEl) return;

    var wasCollapsed = catEl.classList.contains('collapsed');
    Array.prototype.forEach.call(settingsCatListEl.querySelectorAll('.settings-cat'), function(el) {
      el.classList.add('collapsed');
    });
    if (wasCollapsed) catEl.classList.remove('collapsed');
  });

  addCatTrigger.addEventListener('click', function() {
    addCatTrigger.hidden = true;
    addCatPanel.hidden = false;
    renderParentSelect(addCatPanel.querySelector('select.parent'), null);
    addCatPanel.querySelector('input.name').focus();
  });
  addCatPanel.addEventListener('click', function(e) {
    // 이모지 input 클릭 → picker 열기
    if (e.target.classList.contains('emoji')) {
      e.preventDefault();
      openEmojiPicker(e.target);
      return;
    }
    var action = e.target.dataset && e.target.dataset.action;
    if (action === 'confirm') handleAddCategoryConfirm();
    else if (action === 'cancel') clearAddCatPanel();
  });
  addCatPanel.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.target.tagName !== 'SELECT') { e.preventDefault(); handleAddCategoryConfirm(); }
    else if (e.key === 'Escape') { e.preventDefault(); clearAddCatPanel(); }
  });

  dataActionsEl.addEventListener('click', function(e) {
    var action = e.target.dataset && e.target.dataset.action;
    if (action === 'export') handleExport();
    else if (action === 'import') importInput.click();
    else if (action === 'reset') handleReset();
  });
  importInput.addEventListener('change', function(e) {
    var file = e.target.files && e.target.files[0];
    handleImportFile(file);
    e.target.value = '';
  });

  // ===== Init =====
  state = loadStateLocal();
  saveStateLocal();
  viewMonth = currentMonthKey();
  renderHome();

  initCloudSync(function(remote) {
    cloudApplyingRemote = true;
    state = migrate(remote);
    saveStateLocal();
    cloudApplyingRemote = false;
    if (!screenHome.hidden) renderHome();
    if (!screenStats.hidden) renderStats();
    if (!screenSettings.hidden) renderSettings();
  });
})();
</script>
</body>
</html>
