<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>가계부</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" />
  <style>
    :root {
      --color-text-primary: #37352f;
      --color-background-primary: #ffffff;
      --color-background-secondary: #f7f7f5;
      --color-border-tertiary: #e9e9e7;
      --border-radius-md: 6px;

      --color-text-muted: #787774;
      --color-warn-bg: #FCEBEB;
      --color-warn: #e03e3e;
      --color-caution: #dfab01;
      --color-progress-track: rgba(0, 0, 0, 0.08);

      --fs-base: 14px;
      --fs-sm: 12px;
      --fs-xs: 11px;
      --fs-h1: 18px;
      --fs-amount: 16px;
      --fs-hero: 26px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-text-primary: #e6e6e6;
        --color-background-primary: #191919;
        --color-background-secondary: #1f1f1f;
        --color-border-tertiary: #373737;
        --color-text-muted: #9b9a97;
        --color-warn-bg: #4a1f1f;
        --color-progress-track: rgba(255, 255, 255, 0.10);
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      padding: 12px 8px;
      font-family: 'Galmuri9', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      color: var(--color-text-primary);
      font-size: var(--fs-base);
      line-height: 1.5;
    }

    .widget {
      max-width: 380px;
      margin: 0 auto;
      padding: 16px;
      background: var(--color-background-primary);
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      position: relative;
    }

    /* ===== Header ===== */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .top-header h1 {
      margin: 0;
      font-size: var(--fs-h1);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .cloud-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      font-size: 14px;
      color: var(--color-text-muted);
      cursor: help;
      user-select: none;
    }
    .cloud-status[data-tone="ok"] { color: var(--color-text-primary); }
    .cloud-status[data-tone="pending"] { color: var(--color-caution); }
    .cloud-status[data-tone="err"] { color: var(--color-warn); }
    .icon-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--color-text-primary);
      cursor: pointer;
      border-radius: var(--border-radius-md);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover { background: var(--color-background-secondary); }

    /* ===== Month nav ===== */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      margin-bottom: 10px;
    }
    .month-nav button {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--color-text-primary);
      cursor: pointer;
      border-radius: var(--border-radius-md);
      font-size: 16px;
      font-family: inherit;
    }
    .month-nav button:hover:not(:disabled) {
      background: var(--color-border-tertiary);
    }
    .month-nav button:disabled {
      color: var(--color-text-muted);
      cursor: not-allowed;
      opacity: 0.35;
    }
    .month-nav .nav-label {
      font-weight: bold;
      font-size: var(--fs-base);
      flex: 1;
      text-align: center;
    }
    .month-nav .nav-label.not-current {
      color: var(--color-caution);
    }

    /* ===== Hero ===== */
    .hero {
      padding: 16px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      margin-bottom: 14px;
    }
    .hero-label {
      display: block;
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      margin-bottom: 4px;
    }
    .hero-amount {
      display: block;
      font-size: var(--fs-hero);
      font-weight: bold;
      line-height: 1.2;
      word-break: keep-all;
    }
    .hero-amount.over { color: var(--color-warn); }
    .hero-meta {
      display: block;
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      margin-top: 6px;
    }

    /* ===== Sections ===== */
    section { margin-bottom: 18px; }
    section:last-of-type { margin-bottom: 0; }

    h2 {
      margin: 0 0 8px 0;
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      font-weight: normal;
      letter-spacing: 0.02em;
    }

    /* ===== Quick dates ===== */
    .quick-dates {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .quick-dates button {
      flex: 1;
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--fs-sm);
    }
    .quick-dates button:hover {
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
    }

    /* ===== Input ===== */
    .input-row {
      display: flex;
      gap: 6px;
    }
    .input-row input {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      font-family: inherit;
      font-size: var(--fs-base);
    }
    .input-row input:focus {
      outline: none;
      border-color: var(--color-text-muted);
    }
    .input-row button {
      min-height: 44px;
      min-width: 64px;
      padding: 0 14px;
      border: 1px solid var(--color-text-primary);
      border-radius: var(--border-radius-md);
      background: var(--color-text-primary);
      color: var(--color-background-primary);
      font-family: inherit;
      font-size: var(--fs-base);
      font-weight: bold;
      cursor: pointer;
    }
    .input-row button:hover { opacity: 0.85; }

    /* ===== Weeks ===== */
    .week {
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      margin-bottom: 8px;
      cursor: pointer;
    }
    .week.over { background: var(--color-warn-bg); }
    .week-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-sm);
    }
    .week-row .label {
      color: var(--color-text-muted);
      flex: 1;
    }
    .week-row .amount {
      font-weight: bold;
      font-size: var(--fs-base);
    }
    .week-row .chevron {
      color: var(--color-text-muted);
      transition: transform 0.2s;
      font-size: 12px;
      width: 14px;
      text-align: right;
    }
    .week.collapsed .chevron { transform: rotate(-90deg); }
    .week-detail { margin-top: 10px; }
    .week.collapsed .week-detail { display: none; }

    .progress {
      height: 6px;
      background: var(--color-progress-track);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      transition: width 0.2s;
      border-radius: 3px;
    }

    /* ===== Categories (main view) ===== */
    .category-view {
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      margin-bottom: 8px;
    }
    .cv-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
    }
    .cv-emoji {
      font-size: 16px;
      line-height: 1;
      flex-shrink: 0;
    }
    .cv-name {
      font-weight: bold;
      flex: 1;
      font-size: var(--fs-base);
    }
    .cv-amount {
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
    }
    .cv-amount .spent {
      color: var(--color-text-primary);
      font-weight: bold;
      font-size: var(--fs-base);
    }

    /* ===== Transactions ===== */
    .tx-group { margin-bottom: 14px; }
    .tx-group:last-child { margin-bottom: 0; }
    .tx-group-header {
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      margin-bottom: 6px;
      padding-left: 4px;
    }
    .tx {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      margin-bottom: 6px;
    }
    .tx-body {
      flex: 1;
      min-width: 0;
    }
    .tx-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .tx-amount {
      font-weight: bold;
      font-size: var(--fs-amount);
    }
    .tx-raw {
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      word-break: break-all;
    }
    .tx-delete {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      border-radius: var(--border-radius-md);
      font-size: 18px;
      flex-shrink: 0;
    }
    .tx-delete:hover {
      background: var(--color-border-tertiary);
      color: var(--color-warn);
    }

    /* ===== Empty state ===== */
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 8px;
      line-height: 1;
    }
    .empty-message {
      color: var(--color-text-muted);
      font-size: var(--fs-sm);
    }

    /* ===== Badge ===== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: var(--fs-xs);
      font-weight: normal;
      flex-shrink: 0;
    }

    /* ===== Settings screen ===== */
    .screen[hidden] { display: none; }

    .settings-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .settings-header h2 {
      margin: 0;
      font-size: var(--fs-h1);
      color: var(--color-text-primary);
      font-weight: bold;
    }

    .settings-section { margin-bottom: 22px; }
    .settings-section:last-child { margin-bottom: 0; }
    .settings-section h3 {
      margin: 0 0 8px 0;
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      font-weight: normal;
      letter-spacing: 0.02em;
    }

    .limit-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      margin-bottom: 6px;
      font-size: var(--fs-base);
    }
    .limit-row .label {
      flex: 1;
      color: var(--color-text-muted);
    }
    .limit-row input {
      width: 120px;
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      font-family: inherit;
      font-size: var(--fs-base);
      text-align: right;
    }
    .limit-row input:focus { outline: none; border-color: var(--color-text-muted); }

    .settings-cat {
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      margin-bottom: 8px;
    }
    .settings-cat-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .settings-cat input {
      font-family: inherit;
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
    }
    .settings-cat input:focus { outline: none; border-color: var(--color-text-muted); }
    .settings-cat .emoji-input {
      width: 48px;
      min-height: 36px;
      padding: 0;
      text-align: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .settings-cat .name-input {
      flex: 1;
      min-width: 0;
      min-height: 36px;
      padding: 0 10px;
      font-size: var(--fs-base);
      font-weight: bold;
    }
    .settings-cat .kw-input {
      width: 100%;
      min-height: 36px;
      padding: 0 10px;
      font-size: var(--fs-sm);
      margin-bottom: 8px;
    }
    .settings-cat .budget-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
    }
    .settings-cat .budget-row input {
      width: 130px;
      min-height: 36px;
      padding: 0 10px;
      font-size: var(--fs-base);
      text-align: right;
    }
    .settings-cat-delete {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      border-radius: var(--border-radius-md);
      font-size: 18px;
      flex-shrink: 0;
    }
    .settings-cat-delete:hover {
      background: var(--color-border-tertiary);
      color: var(--color-warn);
    }

    .add-cat-trigger {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border: 1px dashed var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--fs-base);
      margin-top: 4px;
    }
    .add-cat-trigger:hover {
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
    }

    .add-cat-panel {
      margin-top: 8px;
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .add-cat-panel .row1 {
      display: flex;
      gap: 8px;
    }
    .add-cat-panel input {
      font-family: inherit;
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
    }
    .add-cat-panel input:focus { outline: none; border-color: var(--color-text-muted); }
    .add-cat-panel .emoji {
      width: 56px;
      min-height: 44px;
      padding: 0;
      text-align: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .add-cat-panel .name {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      padding: 0 12px;
      font-size: var(--fs-base);
    }
    .add-cat-panel .kw,
    .add-cat-panel .budget {
      min-height: 44px;
      padding: 0 12px;
      font-size: var(--fs-base);
    }
    .panel-actions {
      display: flex;
      gap: 8px;
    }
    .panel-actions button {
      flex: 1;
      min-height: 44px;
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--fs-base);
    }
    .panel-actions .primary {
      background: var(--color-text-primary);
      color: var(--color-background-primary);
      border-color: var(--color-text-primary);
      font-weight: bold;
    }

    /* ===== Data section ===== */
    .data-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .data-actions button {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--fs-base);
      text-align: left;
    }
    .data-actions button:hover {
      background: var(--color-border-tertiary);
    }
    .data-actions button.danger {
      color: var(--color-warn);
    }
    .data-actions .data-hint {
      font-size: var(--fs-xs);
      color: var(--color-text-muted);
      padding: 0 4px;
    }
    .import-input { display: none; }

    /* ===== Toast ===== */
    .toast {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      background: var(--color-text-primary);
      color: var(--color-background-primary);
      border-radius: var(--border-radius-md);
      font-size: var(--fs-sm);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      max-width: 90%;
      text-align: center;
      z-index: 10;
      white-space: nowrap;
    }
    .toast.visible { opacity: 0.95; }
  </style>
</head>
<body>
<main class="widget">
  <header class="top-header">
    <h1>가계부</h1>
    <div class="header-right">
      <span class="cloud-status" data-tone="" title="로컬 저장만">⌂</span>
      <button class="icon-btn settings-btn" type="button" aria-label="설정">⚙</button>
    </div>
  </header>

  <!-- ===== Main screen ===== -->
  <div class="screen screen-main">
    <div class="month-nav">
      <button class="nav-prev" type="button" aria-label="이전 달">←</button>
      <span class="nav-label">2026년 4월</span>
      <button class="nav-next" type="button" aria-label="다음 달">→</button>
    </div>

    <section class="hero">
      <span class="hero-label">남은 예산</span>
      <span class="hero-amount">0원</span>
      <span class="hero-meta"></span>
    </section>

    <section class="input-section">
      <div class="quick-dates">
        <button type="button" data-chip="오늘">오늘</button>
        <button type="button" data-chip="어제">어제</button>
        <button type="button" data-chip="그제">그제</button>
      </div>
      <div class="input-row">
        <input id="entry" type="text" placeholder="예: 점심 김밥 5,000" autocomplete="off" />
        <button id="add-btn" type="button">추가</button>
      </div>
    </section>

    <section class="weeks-section">
      <h2>주차별 지출</h2>
      <div class="weeks"></div>
    </section>

    <section class="categories-section">
      <h2>카테고리별 지출</h2>
      <div class="category-list"></div>
    </section>

    <section class="transactions">
      <h2>최근 내역</h2>
      <div class="tx-list"></div>
      <div class="empty-state" hidden>
        <div class="empty-icon">📒</div>
        <div class="empty-message">이 달의 지출이 아직 없어요</div>
      </div>
    </section>
  </div>

  <!-- ===== Settings screen ===== -->
  <div class="screen screen-settings" hidden>
    <header class="settings-header">
      <button class="icon-btn back-btn" type="button" aria-label="뒤로">←</button>
      <h2>설정</h2>
    </header>

    <div class="settings-section">
      <h3>예산 한도</h3>
      <div class="limit-row">
        <span class="label">월 한도</span>
        <input type="number" inputmode="numeric" name="monthLimit" />
        <span>원</span>
      </div>
      <div class="limit-row">
        <span class="label">주 한도</span>
        <input type="number" inputmode="numeric" name="weekLimit" />
        <span>원</span>
      </div>
    </div>

    <div class="settings-section">
      <h3>카테고리 관리</h3>
      <div class="settings-category-list"></div>
      <button class="add-cat-trigger" type="button">+ 카테고리 추가</button>
      <div class="add-cat-panel" hidden>
        <div class="row1">
          <input class="emoji" type="text" maxlength="4" placeholder="🔖" />
          <input class="name" type="text" placeholder="이름" />
        </div>
        <input class="kw" type="text" placeholder="키워드 (쉼표 구분)" />
        <input class="budget" type="number" inputmode="numeric" placeholder="예산 (원)" />
        <div class="panel-actions">
          <button class="primary" type="button" data-action="confirm">추가</button>
          <button class="ghost" type="button" data-action="cancel">취소</button>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <h3>데이터 관리</h3>
      <div class="data-actions">
        <button type="button" data-action="export">📤 JSON 내보내기</button>
        <button type="button" data-action="import">📥 JSON 가져오기</button>
        <button type="button" data-action="reset" class="danger">🗑 모든 데이터 초기화</button>
        <input type="file" class="import-input" accept="application/json,.json" />
        <p class="data-hint">내보낸 JSON 파일은 다른 디바이스나 백업용으로 활용하세요. 가져오기 시 현재 데이터는 덮어씌워집니다.</p>
      </div>
    </div>
  </div>

  <div class="toast"></div>
</main>

<script>
(function () {
  'use strict';

  // ===== Cloud sync constants =====
  var WORKER_URL = 'REPLACE-ME';
  var SAVE_DEBOUNCE_MS = 1500;

  // ===== Constants =====
  var KEYS = {
    CATEGORIES: 'budget_widget_v1_categories',
    TRANSACTIONS: 'budget_widget_v1_transactions',
    META: 'budget_widget_v1_meta'
  };
  var DEFAULT_MONTH_LIMIT = 1000000;
  var DEFAULT_WEEK_LIMIT = 250000;

  var CATEGORY_COLORS = ['brown', 'orange', 'yellow', 'green', 'blue', 'purple', 'pink'];
  var COLOR_HEX = {
    gray:   { rgb: '155,154,151', text: '#9b9a97' },
    brown:  { rgb: '100,71,58',   text: '#a16f4d' },
    orange: { rgb: '217,115,13',  text: '#d9730d' },
    yellow: { rgb: '223,171,1',   text: '#dfab01' },
    green:  { rgb: '15,123,108',  text: '#2ea043' },
    blue:   { rgb: '11,110,153',  text: '#2383e2' },
    purple: { rgb: '105,64,165',  text: '#9065c2' },
    pink:   { rgb: '173,26,114',  text: '#c44ba0' },
    red:    { rgb: '224,62,62',   text: '#e03e3e' }
  };

  var DATE_KEYWORDS = [
    { word: '그저께', offset: -2 },
    { word: '그제',   offset: -2 },
    { word: '어제',   offset: -1 },
    { word: '오늘',   offset:  0 }
  ];

  // ===== State =====
  var state = {
    categories: [],
    transactions: [],
    meta: { nextTxId: 1, nextCatId: 1, monthLimit: DEFAULT_MONTH_LIMIT, weekLimit: DEFAULT_WEEK_LIMIT }
  };

  // 사용자가 보고 있는 월 (yyyy-mm). 초기값 = 오늘 month.
  var viewMonth = null;

  // ===== Cloud sync state =====
  var cloudPageId = null;
  var cloudKey = null;
  var cloudEnabled = false;
  var cloudSaveTimer = null;
  var cloudInFlight = false;
  var cloudPendingSave = false;
  var cloudApplyingRemote = false;

  function defaultState() {
    return {
      categories: [
        { id: 1, name: '카페', emoji: '☕', keywords: ['카페','커피','아메리카노','라떼','스타벅스'], budget: 100000, color: 'brown' },
        { id: 2, name: '식비', emoji: '🍚', keywords: ['식비','점심','저녁','아침','식당','김밥','분식','배달'], budget: 400000, color: 'orange' },
        { id: 3, name: '교통', emoji: '🚇', keywords: ['교통','택시','지하철','버스','주유'], budget: 100000, color: 'yellow' },
        { id: 4, name: '쇼핑', emoji: '🛍', keywords: ['쇼핑','옷','쿠팡','온라인','배송'], budget: 200000, color: 'green' },
        { id: 5, name: '기타', emoji: '', keywords: [], budget: 200000, color: 'gray' }
      ],
      transactions: [],
      meta: { nextTxId: 1, nextCatId: 6, monthLimit: DEFAULT_MONTH_LIMIT, weekLimit: DEFAULT_WEEK_LIMIT }
    };
  }

  function migrate(loaded) {
    loaded.categories = (loaded.categories || []).map(function(c) {
      if (!('emoji' in c)) c.emoji = '';
      return c;
    });
    loaded.transactions = loaded.transactions || [];
    loaded.meta = loaded.meta || {};
    if (typeof loaded.meta.monthLimit !== 'number') loaded.meta.monthLimit = DEFAULT_MONTH_LIMIT;
    if (typeof loaded.meta.weekLimit !== 'number') loaded.meta.weekLimit = DEFAULT_WEEK_LIMIT;
    if (typeof loaded.meta.nextTxId !== 'number') loaded.meta.nextTxId = 1;
    if (typeof loaded.meta.nextCatId !== 'number') loaded.meta.nextCatId = 1;
    return loaded;
  }

  function loadStateLocal() {
    try {
      var cats = localStorage.getItem(KEYS.CATEGORIES);
      var txs  = localStorage.getItem(KEYS.TRANSACTIONS);
      var meta = localStorage.getItem(KEYS.META);
      if (cats && txs && meta) {
        return migrate({
          categories: JSON.parse(cats),
          transactions: JSON.parse(txs),
          meta: JSON.parse(meta)
        });
      }
    } catch (err) {
      console.warn('가계부 데이터 로드 실패, 기본값 사용', err);
    }
    return defaultState();
  }

  function saveStateLocal() {
    try {
      localStorage.setItem(KEYS.CATEGORIES, JSON.stringify(state.categories));
      localStorage.setItem(KEYS.TRANSACTIONS, JSON.stringify(state.transactions));
      localStorage.setItem(KEYS.META, JSON.stringify(state.meta));
    } catch (err) {
      console.warn('가계부 데이터 저장 실패 (인메모리 유지)', err);
    }
  }

  function saveState() {
    saveStateLocal();
    if (cloudEnabled && !cloudApplyingRemote) {
      cloudScheduleSave();
    }
  }

  // ===== Cloud sync functions =====
  function cloudReadParams() {
    try {
      var sp = new URLSearchParams(location.search);
      var hashRaw = (location.hash || '').replace(/^#/, '');
      var hp = new URLSearchParams(hashRaw);
      cloudPageId = sp.get('np') || sp.get('page') || hp.get('np') || hp.get('page') || null;
      cloudKey = sp.get('nk') || hp.get('nk') || null;
      var workerOk = typeof WORKER_URL === 'string' && WORKER_URL && WORKER_URL.indexOf('REPLACE-ME') === -1;
      cloudEnabled = !!(cloudPageId && workerOk);
    } catch (e) {
      cloudEnabled = false;
    }
  }

  function cloudHeaders() {
    var h = { 'Content-Type': 'application/json' };
    if (cloudKey) h['X-Widget-Key'] = cloudKey;
    return h;
  }

  function cloudUrl() {
    return WORKER_URL.replace(/\/+$/, '') + '/?p=' + encodeURIComponent(cloudPageId);
  }

  function setCloudStatus(icon, tone, title) {
    var el = widget && widget.querySelector('.cloud-status');
    if (!el) return;
    el.textContent = icon;
    el.dataset.tone = tone || '';
    if (title) el.title = title;
  }

  function cloudLoad() {
    if (!cloudEnabled) return Promise.resolve(null);
    setCloudStatus('⟳', 'pending', '동기화 중…');
    return fetch(cloudUrl(), { method: 'GET', headers: cloudHeaders() })
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(data) {
        setCloudStatus('☁', 'ok', '동기화됨 · ' + new Date().toLocaleTimeString('ko-KR'));
        return (data && data.state) || null;
      })
      .catch(function(e) {
        setCloudStatus('!', 'err', '동기화 실패: ' + (e && e.message || e));
        console.warn('[cloud] load failed:', e);
        return null;
      });
  }

  function cloudSaveNow() {
    if (!cloudEnabled) return Promise.resolve();
    if (cloudInFlight) { cloudPendingSave = true; return Promise.resolve(); }
    cloudInFlight = true;
    setCloudStatus('⟳', 'pending', '저장 중…');
    return fetch(cloudUrl(), {
      method: 'PUT',
      headers: cloudHeaders(),
      body: JSON.stringify(state)
    })
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        setCloudStatus('☁', 'ok', '동기화됨 · ' + new Date().toLocaleTimeString('ko-KR'));
      })
      .catch(function(e) {
        setCloudStatus('!', 'err', '저장 실패: ' + (e && e.message || e));
        console.warn('[cloud] save failed:', e);
      })
      .then(function() {
        cloudInFlight = false;
        if (cloudPendingSave) {
          cloudPendingSave = false;
          cloudScheduleSave();
        }
      });
  }

  function cloudScheduleSave() {
    if (!cloudEnabled) return;
    if (cloudApplyingRemote) return;
    if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
    cloudSaveTimer = setTimeout(cloudSaveNow, SAVE_DEBOUNCE_MS);
  }

  function initCloudSync(onRemoteApplied) {
    cloudReadParams();
    if (!cloudEnabled) {
      var reason = !cloudPageId
        ? '로컬 저장만 (URL에 ?np=... 없음)'
        : '로컬 저장만 (Worker URL 미설정)';
      setCloudStatus('⌂', '', reason);
      return Promise.resolve(false);
    }
    cloudApplyingRemote = true;
    return cloudLoad().then(function(remote) {
      cloudApplyingRemote = false;
      if (remote) {
        if (typeof onRemoteApplied === 'function') onRemoteApplied(remote);
      } else {
        cloudScheduleSave();
      }
      return true;
    }).catch(function() {
      cloudApplyingRemote = false;
      return false;
    });
  }

  // ===== Utilities =====
  function formatMoney(n) { return Math.round(n).toLocaleString('ko-KR') + '원'; }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function todayStr() { return ymd(new Date()); }
  function offsetDate(offset) { var d = new Date(); d.setDate(d.getDate() + offset); return ymd(d); }
  function monthKey(dateStr) { return dateStr.slice(0, 7); }
  function getWeekIndex(dateStr) {
    var day = parseInt(dateStr.slice(8, 10), 10);
    return Math.min(3, Math.floor((day - 1) / 7));
  }
  function currentMonthKey() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
  function shiftMonth(mk, delta) {
    var p = mk.split('-');
    var y = parseInt(p[0], 10);
    var m = parseInt(p[1], 10) - 1 + delta;
    var d = new Date(y, m, 1);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
  }
  function formatMonthLabel(mk) {
    var p = mk.split('-');
    return p[0] + '년 ' + parseInt(p[1], 10) + '월';
  }
  function formatTxDate(dateStr) {
    if (dateStr === todayStr()) return '오늘';
    if (dateStr === offsetDate(-1)) return '어제';
    if (dateStr === offsetDate(-2)) return '그저께';
    var p = dateStr.split('-');
    return parseInt(p[1], 10) + '월 ' + parseInt(p[2], 10) + '일';
  }
  function getCategoryById(id) {
    for (var i = 0; i < state.categories.length; i++) {
      if (state.categories[i].id === id) return state.categories[i];
    }
    return null;
  }
  function getEtcCategory() {
    for (var i = 0; i < state.categories.length; i++) {
      if (state.categories[i].name === '기타') return state.categories[i];
    }
    return null;
  }
  function progressColor(ratio, baseHex) {
    if (ratio >= 1) return COLOR_HEX.red.text;
    if (ratio >= 0.8) return COLOR_HEX.yellow.text;
    return baseHex;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[ch];
    });
  }
  function badgeHtml(category) {
    var c = COLOR_HEX[category.color] || COLOR_HEX.gray;
    var emoji = category.emoji ? escapeHtml(category.emoji) + ' ' : '';
    return '<span class="badge" style="background-color: rgba(' + c.rgb + ', 0.25); color: ' + c.text + '">' + emoji + escapeHtml(category.name) + '</span>';
  }

  // 입력 텍스트의 숫자 그룹에 천 단위 콤마 자동 적용 (이미 콤마 있는 경우 정규화)
  function autoCommaText(text) {
    return text.replace(/\d{1,3}(?:,\d{3})+|\d{4,}/g, function(m) {
      var n = parseInt(m.replace(/,/g, ''), 10);
      if (!Number.isFinite(n)) return m;
      return n.toLocaleString('ko-KR');
    });
  }

  // ===== Parsers =====
  function parseDate(text) {
    for (var i = 0; i < DATE_KEYWORDS.length; i++) {
      var k = DATE_KEYWORDS[i];
      var idx = text.indexOf(k.word);
      if (idx !== -1) {
        return {
          date: offsetDate(k.offset),
          remainText: text.slice(0, idx) + text.slice(idx + k.word.length)
        };
      }
    }
    return { date: todayStr(), remainText: text };
  }
  function parseAmount(text) {
    var re = /\d{1,3}(?:,\d{3})+|\d{3,}/;
    var m = text.match(re);
    if (!m) return { amount: null, remainText: text };
    var amount = parseInt(m[0].replace(/,/g, ''), 10);
    if (!Number.isFinite(amount) || amount <= 0) return { amount: null, remainText: text };
    return { amount: amount, remainText: text.slice(0, m.index) + text.slice(m.index + m[0].length) };
  }
  function matchCategory(text, categories) {
    for (var i = 0; i < categories.length; i++) {
      var c = categories[i];
      if (c.keywords && c.keywords.length) {
        for (var j = 0; j < c.keywords.length; j++) {
          var k = c.keywords[j];
          if (k && text.indexOf(k) !== -1) return c.id;
        }
      }
    }
    var etc = null;
    for (var n = 0; n < categories.length; n++) {
      if (categories[n].name === '기타') { etc = categories[n]; break; }
    }
    if (etc) return etc.id;
    return categories.length > 0 ? categories[0].id : null;
  }
  function parseEntry(rawText) {
    var trimmed = (rawText || '').trim();
    if (!trimmed) return null;
    var dateRes = parseDate(trimmed);
    var amountRes = parseAmount(dateRes.remainText);
    if (amountRes.amount === null) return null;
    var categoryId = matchCategory(amountRes.remainText, state.categories);
    if (categoryId === null) return null;
    return { amount: amountRes.amount, date: dateRes.date, categoryId: categoryId, rawText: trimmed };
  }

  // ===== DOM refs =====
  var widget = document.querySelector('.widget');
  var screenMain = widget.querySelector('.screen-main');
  var screenSettings = widget.querySelector('.screen-settings');
  var navPrev = widget.querySelector('.nav-prev');
  var navNext = widget.querySelector('.nav-next');
  var navLabel = widget.querySelector('.nav-label');
  var heroAmount = widget.querySelector('.hero-amount');
  var heroMeta = widget.querySelector('.hero-meta');
  var weeksEl = widget.querySelector('.weeks');
  var categoryListEl = widget.querySelector('.category-list');
  var txListEl = widget.querySelector('.tx-list');
  var emptyStateEl = widget.querySelector('.empty-state');
  var toastEl = widget.querySelector('.toast');
  var entryInput = widget.querySelector('#entry');
  var addBtn = widget.querySelector('#add-btn');
  var settingsBtn = widget.querySelector('.settings-btn');
  var backBtn = widget.querySelector('.back-btn');
  var quickDatesEl = widget.querySelector('.quick-dates');
  var monthLimitInput = screenSettings.querySelector('input[name="monthLimit"]');
  var weekLimitInput = screenSettings.querySelector('input[name="weekLimit"]');
  var settingsCatListEl = screenSettings.querySelector('.settings-category-list');
  var addCatTrigger = screenSettings.querySelector('.add-cat-trigger');
  var addCatPanel = screenSettings.querySelector('.add-cat-panel');
  var dataActionsEl = screenSettings.querySelector('.data-actions');
  var importInput = screenSettings.querySelector('.import-input');

  // ===== Rendering: month nav =====
  function renderMonthNav() {
    navLabel.textContent = formatMonthLabel(viewMonth);
    var cur = currentMonthKey();
    if (viewMonth === cur) {
      navLabel.classList.remove('not-current');
    } else {
      navLabel.classList.add('not-current');
    }
    // 미래 달 disable
    navNext.disabled = (shiftMonth(viewMonth, 1) > cur);
    // 이전은 항상 활성 (데이터가 어디까지 있는지 모르니 무한 이동 허용)
    navPrev.disabled = false;
  }

  // ===== Rendering: main =====
  function renderHero() {
    var monthSum = state.transactions
      .filter(function(t) { return monthKey(t.date) === viewMonth; })
      .reduce(function(s,t) { return s + t.amount; }, 0);
    var limit = state.meta.monthLimit;
    var remaining = limit - monthSum;
    var ratio = limit > 0 ? monthSum / limit : 0;
    var pct = Math.round(ratio * 100);

    var label = (viewMonth === currentMonthKey()) ? '남은 예산' : formatMonthLabel(viewMonth) + ' 잔여';
    widget.querySelector('.hero-label').textContent = label;

    if (remaining >= 0) {
      heroAmount.textContent = formatMoney(remaining);
      heroAmount.classList.remove('over');
    } else {
      heroAmount.textContent = formatMoney(-remaining) + ' 초과';
      heroAmount.classList.add('over');
    }
    heroMeta.textContent = '/ ' + formatMoney(limit) + ' · ' + pct + '%';
  }

  function renderWeeks() {
    var monthTxs = state.transactions.filter(function(t) { return monthKey(t.date) === viewMonth; });
    var weekSums = [0, 0, 0, 0];
    monthTxs.forEach(function(t) { weekSums[getWeekIndex(t.date)] += t.amount; });
    var weekRanges = ['1~7일', '8~14일', '15~21일', '22일 이후'];
    // 이번 달 보고 있을 때만 현재 주차 펼침. 다른 달은 모두 접힘.
    var curWeek = (viewMonth === currentMonthKey()) ? getWeekIndex(todayStr()) : -1;
    var limit = state.meta.weekLimit;

    weeksEl.innerHTML = weekSums.map(function(sum, i) {
      var ratio = limit > 0 ? sum / limit : 0;
      var over = ratio >= 1;
      var widthPct = Math.min(100, ratio * 100);
      var color = progressColor(ratio, COLOR_HEX.gray.text);
      var collapsed = (i !== curWeek);
      return '<div class="week' + (over ? ' over' : '') + (collapsed ? ' collapsed' : '') + '" data-week-idx="' + i + '">' +
        '<div class="week-row">' +
          '<span class="label">' + (i + 1) + '주차 (' + weekRanges[i] + ')</span>' +
          '<span class="amount">' + formatMoney(sum) + '</span>' +
          '<span class="chevron">▾</span>' +
        '</div>' +
        '<div class="week-detail">' +
          '<div class="progress"><div class="progress-fill" style="width: ' + widthPct + '%; background: ' + color + '"></div></div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function renderCategoriesView() {
    categoryListEl.innerHTML = state.categories.map(function(cat) {
      var sum = state.transactions
        .filter(function(t) { return t.categoryId === cat.id && monthKey(t.date) === viewMonth; })
        .reduce(function(s,t) { return s + t.amount; }, 0);
      var ratio = cat.budget > 0 ? sum / cat.budget : 0;
      var widthPct = cat.budget > 0 ? Math.min(100, ratio * 100) : 0;
      var baseHex = (COLOR_HEX[cat.color] || COLOR_HEX.gray).text;
      var color = progressColor(ratio, baseHex);
      var emojiHtml = cat.emoji ? '<span class="cv-emoji">' + escapeHtml(cat.emoji) + '</span>' : '';
      return '<div class="category-view">' +
        '<div class="cv-header">' +
          emojiHtml +
          '<span class="cv-name">' + escapeHtml(cat.name) + '</span>' +
          '<span class="cv-amount"><span class="spent">' + formatMoney(sum) + '</span> / ' + formatMoney(cat.budget) + '</span>' +
        '</div>' +
        '<div class="progress"><div class="progress-fill" style="width: ' + widthPct + '%; background: ' + color + '"></div></div>' +
      '</div>';
    }).join('');
  }

  function renderTransactions() {
    // 보고 있는 월의 거래만
    var monthTxs = state.transactions.filter(function(t) { return monthKey(t.date) === viewMonth; });
    var sorted = monthTxs.slice().sort(function(a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return b.id - a.id;
    });
    if (sorted.length === 0) {
      txListEl.innerHTML = '';
      emptyStateEl.hidden = false;
      return;
    }
    emptyStateEl.hidden = true;

    var groups = {};
    var orderDates = [];
    sorted.forEach(function(t) {
      if (!groups[t.date]) { groups[t.date] = []; orderDates.push(t.date); }
      groups[t.date].push(t);
    });

    txListEl.innerHTML = orderDates.map(function(d) {
      var items = groups[d];
      var label = formatTxDate(d);
      var itemHtml = items.map(function(t) {
        var cat = getCategoryById(t.categoryId);
        return '<div class="tx" data-tx-id="' + t.id + '">' +
          '<div class="tx-body">' +
            '<div class="tx-head">' + (cat ? badgeHtml(cat) : '') + '<span class="tx-amount">' + formatMoney(t.amount) + '</span></div>' +
            '<div class="tx-raw">' + escapeHtml(t.rawText) + '</div>' +
          '</div>' +
          '<button class="tx-delete" type="button" data-action="delete-tx" aria-label="삭제">×</button>' +
        '</div>';
      }).join('');
      return '<div class="tx-group">' +
        '<div class="tx-group-header">' + escapeHtml(label) + ' · ' + items.length + '건</div>' +
        itemHtml +
      '</div>';
    }).join('');
  }

  function renderMain() {
    renderMonthNav();
    renderHero();
    renderWeeks();
    renderCategoriesView();
    renderTransactions();
  }

  // ===== Rendering: settings =====
  function renderSettings() {
    monthLimitInput.value = state.meta.monthLimit;
    weekLimitInput.value = state.meta.weekLimit;

    settingsCatListEl.innerHTML = state.categories.map(function(cat) {
      return '<div class="settings-cat" data-cat-id="' + cat.id + '">' +
        '<div class="settings-cat-row">' +
          '<input class="emoji-input" type="text" maxlength="4" value="' + escapeHtml(cat.emoji || '') + '" placeholder="🔖" />' +
          '<input class="name-input" type="text" value="' + escapeHtml(cat.name) + '" />' +
          '<button class="settings-cat-delete" type="button" aria-label="삭제">×</button>' +
        '</div>' +
        '<input class="kw-input" type="text" value="' + escapeHtml((cat.keywords || []).join(', ')) + '" placeholder="키워드 (쉼표 구분)" />' +
        '<div class="budget-row">' +
          '<span>예산</span>' +
          '<input class="budget-input" type="number" inputmode="numeric" value="' + cat.budget + '" />' +
          '<span>원</span>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  // ===== Toast =====
  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('visible');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toastEl.classList.remove('visible'); }, 1800);
  }

  // ===== Screen toggle =====
  function showSettings() {
    renderSettings();
    screenMain.hidden = true;
    screenSettings.hidden = false;
  }
  function showMain() {
    screenSettings.hidden = true;
    screenMain.hidden = false;
    renderMain();
  }

  // ===== Quick dates =====
  function applyQuickDate(keyword) {
    var v = entryInput.value;
    v = v.replace(/(그저께|그제|어제|오늘)\s*/g, '').trim();
    entryInput.value = (keyword + (v ? ' ' + v : ' ')).replace(/\s+/g, ' ');
    entryInput.focus();
    var end = entryInput.value.length;
    try { entryInput.setSelectionRange(end, end); } catch(e) {}
  }

  // ===== Auto comma on entry input =====
  function handleEntryInput() {
    var v = entryInput.value;
    var caret = entryInput.selectionStart;
    var nv = autoCommaText(v);
    if (nv === v) return;
    // caret 위치 보정: 입력된 위치 좌측의 콤마 변화량만큼 이동
    var leftBefore = v.slice(0, caret);
    var leftAfter = autoCommaText(leftBefore);
    var newCaret = leftAfter.length;
    entryInput.value = nv;
    try { entryInput.setSelectionRange(newCaret, newCaret); } catch(e) {}
  }

  // ===== Action handlers =====
  function handleAdd() {
    var text = entryInput.value;
    var entry = parseEntry(text);
    if (!entry) {
      showToast('금액을 못 찾았어요');
      return;
    }
    state.transactions.push({
      id: state.meta.nextTxId,
      amount: entry.amount,
      date: entry.date,
      categoryId: entry.categoryId,
      rawText: entry.rawText
    });
    state.meta.nextTxId += 1;
    saveState();
    entryInput.value = '';

    // 입력한 거래의 month로 viewMonth 자동 이동 (사용자가 다른 달 보다 입력했을 때 누락 방지)
    var entryMonth = monthKey(entry.date);
    if (entryMonth !== viewMonth) {
      viewMonth = entryMonth;
    }
    renderMain();
  }

  function handleDeleteTx(id) {
    state.transactions = state.transactions.filter(function(t) { return t.id !== id; });
    saveState();
    renderMain();
  }

  function handleDeleteCategory(id) {
    var cat = getCategoryById(id);
    if (!cat) return;
    var txCount = state.transactions.filter(function(t) { return t.categoryId === id; }).length;
    var isEtc = cat.name === '기타';
    var etc = getEtcCategory();
    var moveToEtc = !isEtc && etc;

    var msg;
    if (moveToEtc) {
      msg = '"' + cat.name + '" 카테고리를 삭제할까요?\n거래 ' + txCount + '개는 "기타"로 이동됩니다.';
    } else {
      msg = '"' + cat.name + '" 카테고리를 삭제할까요?';
      if (txCount > 0) msg += '\n거래 ' + txCount + '개도 함께 삭제됩니다.';
    }
    if (!window.confirm(msg)) return;

    if (moveToEtc) {
      state.transactions.forEach(function(t) { if (t.categoryId === id) t.categoryId = etc.id; });
    } else {
      state.transactions = state.transactions.filter(function(t) { return t.categoryId !== id; });
    }
    state.categories = state.categories.filter(function(c) { return c.id !== id; });
    saveState();
    renderSettings();
  }

  function pickNextColor() {
    var used = {};
    state.categories.forEach(function(c) { used[c.color] = true; });
    for (var i = 0; i < CATEGORY_COLORS.length; i++) {
      if (!used[CATEGORY_COLORS[i]]) return CATEGORY_COLORS[i];
    }
    return CATEGORY_COLORS[state.categories.length % CATEGORY_COLORS.length];
  }

  function clearAddCatPanel() {
    addCatPanel.querySelector('input.emoji').value = '';
    addCatPanel.querySelector('input.name').value = '';
    addCatPanel.querySelector('input.kw').value = '';
    addCatPanel.querySelector('input.budget').value = '';
    addCatPanel.hidden = true;
    addCatTrigger.hidden = false;
  }

  function handleAddCategoryConfirm() {
    var emoji = addCatPanel.querySelector('input.emoji').value.trim();
    var name = addCatPanel.querySelector('input.name').value.trim();
    var kwRaw = addCatPanel.querySelector('input.kw').value.trim();
    var budgetRaw = addCatPanel.querySelector('input.budget').value.trim();

    if (!name) { showToast('이름을 입력해주세요'); return; }
    var budget = parseInt(budgetRaw, 10);
    if (!Number.isFinite(budget) || budget < 0) {
      showToast('예산은 0 이상의 숫자여야 해요');
      return;
    }
    var keywords = kwRaw
      ? kwRaw.split(',').map(function(s) { return s.trim(); }).filter(Boolean)
      : [];

    state.categories.push({
      id: state.meta.nextCatId,
      name: name,
      emoji: emoji,
      keywords: keywords,
      budget: budget,
      color: pickNextColor()
    });
    state.meta.nextCatId += 1;
    saveState();
    clearAddCatPanel();
    renderSettings();
  }

  function handleSettingsCatChange(id, field, newValue) {
    var cat = getCategoryById(id);
    if (!cat) return;
    if (field === 'emoji') {
      cat.emoji = String(newValue || '').trim().slice(0, 8);
    } else if (field === 'name') {
      var v = String(newValue || '').trim();
      if (v) cat.name = v;
    } else if (field === 'keywords') {
      var raw = String(newValue || '').trim();
      cat.keywords = raw ? raw.split(',').map(function(s) { return s.trim(); }).filter(Boolean) : [];
    } else if (field === 'budget') {
      var num = parseInt(String(newValue).replace(/[^\d-]/g, ''), 10);
      if (Number.isFinite(num) && num >= 0) cat.budget = num;
    }
    saveState();
  }

  function handleLimitChange(field, newValue) {
    var num = parseInt(String(newValue).replace(/[^\d-]/g, ''), 10);
    if (!Number.isFinite(num) || num < 0) {
      showToast('한도는 0 이상의 숫자여야 해요');
      if (field === 'monthLimit') monthLimitInput.value = state.meta.monthLimit;
      else if (field === 'weekLimit') weekLimitInput.value = state.meta.weekLimit;
      return;
    }
    state.meta[field] = num;
    saveState();
  }

  // ===== Data export / import / reset =====
  function handleExport() {
    try {
      var payload = {
        version: 1,
        exportedAt: new Date().toISOString(),
        categories: state.categories,
        transactions: state.transactions,
        meta: state.meta
      };
      var json = JSON.stringify(payload, null, 2);
      var blob = new Blob([json], { type: 'application/json;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      a.href = url;
      a.download = 'budget-' + stamp + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
      showToast('내보내기 완료');
    } catch (e) {
      showToast('내보내기 실패');
      console.warn('[export]', e);
    }
  }

  function handleImportFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function() {
      try {
        var parsed = JSON.parse(reader.result);
        // payload 또는 raw state 둘 다 허용
        var loaded = {
          categories: parsed.categories || [],
          transactions: parsed.transactions || [],
          meta: parsed.meta || {}
        };
        if (!Array.isArray(loaded.categories) || !Array.isArray(loaded.transactions)) {
          throw new Error('형식 오류');
        }
        if (!window.confirm('가져오기 시 현재 데이터는 덮어씌워집니다. 계속할까요?')) return;
        state = migrate(loaded);
        saveState();
        showToast('가져오기 완료');
        renderSettings();
        // viewMonth 갱신: 가장 최근 거래가 있는 month로
        if (state.transactions.length) {
          var maxDate = state.transactions.reduce(function(acc, t) {
            return t.date > acc ? t.date : acc;
          }, state.transactions[0].date);
          viewMonth = monthKey(maxDate);
        } else {
          viewMonth = currentMonthKey();
        }
      } catch (e) {
        showToast('가져오기 실패: ' + (e.message || e));
        console.warn('[import]', e);
      }
    };
    reader.onerror = function() { showToast('파일 읽기 실패'); };
    reader.readAsText(file);
  }

  function handleReset() {
    if (!window.confirm('모든 데이터를 초기화할까요?\n카테고리·거래·예산 한도가 기본값으로 돌아갑니다.')) return;
    state = defaultState();
    viewMonth = currentMonthKey();
    saveState();
    showToast('초기화 완료');
    renderSettings();
  }

  // ===== Event bindings =====
  addBtn.addEventListener('click', handleAdd);
  entryInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); handleAdd(); }
  });
  entryInput.addEventListener('input', handleEntryInput);

  quickDatesEl.addEventListener('click', function(e) {
    var btn = e.target.closest('button[data-chip]');
    if (!btn) return;
    applyQuickDate(btn.dataset.chip);
  });

  navPrev.addEventListener('click', function() {
    viewMonth = shiftMonth(viewMonth, -1);
    renderMain();
  });
  navNext.addEventListener('click', function() {
    var next = shiftMonth(viewMonth, 1);
    if (next > currentMonthKey()) return; // 미래 차단
    viewMonth = next;
    renderMain();
  });

  weeksEl.addEventListener('click', function(e) {
    var weekEl = e.target.closest('.week');
    if (!weekEl) return;
    weekEl.classList.toggle('collapsed');
  });

  txListEl.addEventListener('click', function(e) {
    if (!e.target.dataset || e.target.dataset.action !== 'delete-tx') return;
    var txEl = e.target.closest('.tx');
    if (!txEl) return;
    handleDeleteTx(parseInt(txEl.dataset.txId, 10));
  });

  settingsBtn.addEventListener('click', showSettings);
  backBtn.addEventListener('click', showMain);

  function bindLimitInput(input, field) {
    input.addEventListener('blur', function() { handleLimitChange(field, input.value); });
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    });
  }
  bindLimitInput(monthLimitInput, 'monthLimit');
  bindLimitInput(weekLimitInput, 'weekLimit');

  function handleSettingsListChange(input) {
    if (!input || input.tagName !== 'INPUT') return;
    var catEl = input.closest('.settings-cat');
    if (!catEl) return;
    var id = parseInt(catEl.dataset.catId, 10);
    var cat = getCategoryById(id);
    if (!cat) return;

    if (input.classList.contains('emoji-input')) {
      handleSettingsCatChange(id, 'emoji', input.value);
    } else if (input.classList.contains('name-input')) {
      handleSettingsCatChange(id, 'name', input.value);
      if (!input.value.trim()) input.value = cat.name;
    } else if (input.classList.contains('kw-input')) {
      handleSettingsCatChange(id, 'keywords', input.value);
    } else if (input.classList.contains('budget-input')) {
      handleSettingsCatChange(id, 'budget', input.value);
      input.value = cat.budget;
    }
  }

  settingsCatListEl.addEventListener('blur', function(e) {
    handleSettingsListChange(e.target);
  }, true);
  settingsCatListEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
      e.preventDefault();
      e.target.blur();
    }
  });
  settingsCatListEl.addEventListener('click', function(e) {
    if (!e.target.classList.contains('settings-cat-delete')) return;
    var catEl = e.target.closest('.settings-cat');
    if (!catEl) return;
    handleDeleteCategory(parseInt(catEl.dataset.catId, 10));
  });

  addCatTrigger.addEventListener('click', function() {
    addCatTrigger.hidden = true;
    addCatPanel.hidden = false;
    addCatPanel.querySelector('input.name').focus();
  });
  addCatPanel.addEventListener('click', function(e) {
    var action = e.target.dataset && e.target.dataset.action;
    if (action === 'confirm') handleAddCategoryConfirm();
    else if (action === 'cancel') clearAddCatPanel();
  });
  addCatPanel.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); handleAddCategoryConfirm(); }
    else if (e.key === 'Escape') { e.preventDefault(); clearAddCatPanel(); }
  });

  // Data section
  dataActionsEl.addEventListener('click', function(e) {
    var action = e.target.dataset && e.target.dataset.action;
    if (action === 'export') handleExport();
    else if (action === 'import') importInput.click();
    else if (action === 'reset') handleReset();
  });
  importInput.addEventListener('change', function(e) {
    var file = e.target.files && e.target.files[0];
    handleImportFile(file);
    e.target.value = '';
  });

  // ===== Init =====
  state = loadStateLocal();
  viewMonth = currentMonthKey();
  renderMain();

  initCloudSync(function(remote) {
    cloudApplyingRemote = true;
    state = migrate(remote);
    saveStateLocal();
    cloudApplyingRemote = false;
    renderMain();
    if (!screenSettings.hidden) renderSettings();
  });
})();
</script>
</body>
</html>
