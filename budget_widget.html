<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>가계부</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" />
  <style>
    :root {
      --color-text-primary: #37352f;
      --color-background-primary: #ffffff;
      --color-background-secondary: #f7f7f5;
      --color-border-tertiary: #e9e9e7;
      --border-radius-md: 6px;

      --color-text-muted: #787774;
      --color-warn-bg: #FCEBEB;
      --color-warn: #e03e3e;
      --color-caution: #dfab01;
      --color-progress-track: rgba(0, 0, 0, 0.08);

      --fs-base: 14px;
      --fs-sm: 12px;
      --fs-xs: 11px;
      --fs-h1: 18px;
      --fs-amount: 16px;
      --fs-hero: 26px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-text-primary: #e6e6e6;
        --color-background-primary: #191919;
        --color-background-secondary: #1f1f1f;
        --color-border-tertiary: #373737;
        --color-text-muted: #9b9a97;
        --color-warn-bg: #4a1f1f;
        --color-progress-track: rgba(255, 255, 255, 0.10);
      }
    }
    @media (max-width: 820px) {
      :root {
        --fs-base: 13px;
        --fs-sm: 11px;
        --fs-xs: 10px;
        --fs-h1: 16px;
        --fs-amount: 14px;
        --fs-hero: 22px;
      }
      .widget { zoom: 0.85; }
    }
    @media (max-width: 480px) {
      :root {
        --fs-base: 12px;
        --fs-sm: 10px;
        --fs-xs: 9px;
        --fs-h1: 15px;
        --fs-amount: 13px;
        --fs-hero: 20px;
      }
      .widget { zoom: 0.75; }
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      height: 100%;
    }
    body {
      padding: 12px 8px;
      font-family: 'Galmuri9', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      color: var(--color-text-primary);
      font-size: var(--fs-base);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .widget {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 20px;
      background: var(--color-background-primary);
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .screen {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-gutter: stable;
      padding-right: 4px;
      margin-right: -4px;
    }
    .screen::-webkit-scrollbar { width: 6px; }
    .screen::-webkit-scrollbar-thumb {
      background: var(--color-border-tertiary);
      border-radius: 3px;
    }

    /* ===== Header ===== */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .top-header h1 {
      margin: 0;
      font-size: var(--fs-h1);
      cursor: pointer;
      user-select: none;
      transition: opacity 0.15s;
    }
    .top-header h1:hover { opacity: 0.7; }
    .header-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .cloud-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      font-size: 11px;
      color: var(--color-text-muted);
      cursor: default;
      user-select: none;
      pointer-events: auto;
    }
    .cloud-status[data-tone="ok"] { color: var(--color-text-primary); }
    .cloud-status[data-tone="pending"] { color: var(--color-caution); }
    .cloud-status[data-tone="err"] { color: var(--color-warn); }
    .icon-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--color-text-primary);
      cursor: pointer;
      border-radius: var(--border-radius-md);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover { background: var(--color-background-secondary); }
    .icon-btn.active {
      background: var(--color-text-primary);
      color: var(--color-background-primary);
    }
    .icon-btn.active:hover { opacity: 0.85; background: var(--color-text-primary); }

    /* ===== Sub header (stats/settings) ===== */
    .sub-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .sub-header h2 {
      margin: 0;
      font-size: var(--fs-h1);
      color: var(--color-text-primary);
      font-weight: bold;
    }

    /* ===== Month nav ===== */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      margin-bottom: 10px;
    }
    .month-nav button {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--color-text-primary);
      cursor: pointer;
      border-radius: var(--border-radius-md);
      font-size: 16px;
      font-family: inherit;
    }
    .month-nav button:hover:not(:disabled) {
      background: var(--color-border-tertiary);
    }
    .month-nav button:disabled {
      color: var(--color-text-muted);
      cursor: not-allowed;
      opacity: 0.35;
    }
    .month-nav .nav-label {
      font-weight: bold;
      font-size: var(--fs-base);
      flex: 1;
      text-align: center;
    }
    .month-nav .nav-label.not-current {
      color: var(--color-caution);
    }

    /* ===== Hero ===== */
    .hero {
      padding: 16px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      margin-bottom: 14px;
    }
    .hero-label {
      display: block;
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      margin-bottom: 4px;
    }
    .hero-amount {
      display: block;
      font-size: var(--fs-hero);
      font-weight: bold;
      line-height: 1.2;
      word-break: keep-all;
    }
    .hero-amount.over { color: var(--color-warn); }
    .hero-meta {
      display: block;
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      margin-top: 6px;
    }

    /* ===== Sections ===== */
    section { margin-bottom: 18px; }
    section:last-of-type { margin-bottom: 0; }

    h2.section-title {
      margin: 0 0 8px 0;
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      font-weight: normal;
      letter-spacing: 0.02em;
    }

    /* ===== Quick dates ===== */
    .quick-dates {
      position: relative;
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .quick-dates button {
      flex: 1;
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--fs-sm);
    }
    .quick-dates button:hover {
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
    }
    .quick-dates button.active {
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
      border-color: var(--color-text-primary);
    }
    .quick-dates button.custom-date-btn {
      flex: 0 0 36px;
      padding: 0;
      font-size: 18px;
      line-height: 1;
    }

    /* ===== Calendar modal ===== */
    .cal-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .cal-modal[hidden] { display: none; }
    .cal-box {
      width: min(300px, 100%);
      background: var(--color-background-primary);
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      padding: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .cal-nav {
      width: 32px;
      height: 32px;
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: transparent;
      color: var(--color-text-primary);
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
      line-height: 1;
    }
    .cal-nav:hover { background: var(--color-background-secondary); }
    .cal-title {
      font-weight: 600;
      color: var(--color-text-primary);
      font-size: var(--fs-sm);
    }
    .cal-weekdays, .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .cal-weekdays { margin-bottom: 4px; }
    .cal-weekday {
      text-align: center;
      font-size: var(--fs-xs);
      color: var(--color-text-muted);
      padding: 4px 0;
    }
    .cal-weekday.sun { color: #e03e3e; }
    .cal-weekday.sat { color: #2383e2; }
    .cal-day {
      aspect-ratio: 1;
      border: 0;
      border-radius: var(--border-radius-md);
      background: transparent;
      color: var(--color-text-primary);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--fs-sm);
      padding: 0;
    }
    .cal-day:hover:not(:disabled) { background: var(--color-background-secondary); }
    .cal-day:disabled {
      color: var(--color-text-muted);
      opacity: 0.35;
      cursor: default;
    }
    .cal-day.sun { color: #e03e3e; }
    .cal-day.sat { color: #2383e2; }
    .cal-day.today {
      background: var(--color-background-secondary);
      font-weight: 600;
      outline: 1px solid var(--color-border-tertiary);
    }

    /* ===== Input ===== */
    .input-row {
      display: flex;
      gap: 6px;
    }
    .input-row input {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      font-family: inherit;
      font-size: var(--fs-base);
    }
    .input-row input:focus {
      outline: none;
      border-color: var(--color-text-muted);
    }
    .input-row button {
      min-height: 44px;
      min-width: 64px;
      padding: 0 14px;
      border: 1px solid var(--color-text-primary);
      border-radius: var(--border-radius-md);
      background: var(--color-text-primary);
      color: var(--color-background-primary);
      font-family: inherit;
      font-size: var(--fs-base);
      font-weight: bold;
      cursor: pointer;
    }
    .input-row button:hover { opacity: 0.85; }

    /* ===== Pace card ===== */
    .pace-card {
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
    }
    .pace-row {
      display: flex;
      gap: 8px;
      font-size: var(--fs-sm);
      margin-bottom: 8px;
    }
    .pace-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .pace-col .pace-label {
      color: var(--color-text-muted);
      font-size: var(--fs-xs);
    }
    .pace-col .pace-value {
      font-weight: bold;
      font-size: var(--fs-base);
    }
    .pace-col.over .pace-value { color: var(--color-warn); }
    .pace-col.under .pace-value { color: #2ea043; }
    .pace-forecast {
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      padding-top: 8px;
      border-top: 1px solid var(--color-border-tertiary);
    }
    .pace-forecast.warn { color: var(--color-warn); }
    .pace-forecast.ok { color: #2ea043; }

    /* ===== Week budget card (home) ===== */
    .week-budget-card {
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .wb-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: var(--fs-sm);
    }
    .wb-label { color: var(--color-text-muted); }
    .wb-amount {
      font-weight: bold;
      font-size: var(--fs-base);
    }
    .wb-amount.over { color: var(--color-warn); }
    .wb-meta {
      font-size: var(--fs-xs);
      color: var(--color-text-muted);
    }
    .wb-meta.warn { color: var(--color-warn); }

    /* ===== Donut chart ===== */
    .cat-summary {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
    }
    .donut-wrap {
      position: relative;
      width: 110px;
      height: 110px;
      flex-shrink: 0;
    }
    .donut {
      width: 100%;
      height: 100%;
    }
    .donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .donut-center .pct {
      font-weight: bold;
      font-size: 20px;
      line-height: 1;
    }
    .donut-center .label {
      font-size: 10px;
      color: var(--color-text-muted);
      margin-top: 2px;
    }
    .cat-labels {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: var(--fs-sm);
      min-width: 0;
    }
    .cat-label {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .cat-label .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .cat-label .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cat-label .pct {
      font-weight: bold;
      color: var(--color-text-primary);
      flex-shrink: 0;
    }
    .cat-summary-empty {
      padding: 20px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      text-align: center;
      color: var(--color-text-muted);
      font-size: var(--fs-sm);
    }

    /* ===== Category compare (I: 이중 막대) ===== */
    .cat-compare {
      padding: 10px 14px;
      background: transparent;
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
    }
    .compare-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px 0;
      border-bottom: 1px solid var(--color-border-tertiary);
    }
    .compare-row:last-child { border-bottom: none; padding-bottom: 0; }
    .compare-row:first-child { padding-top: 0; }
    .compare-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: var(--fs-sm);
    }
    .compare-header .name {
      font-weight: bold;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .compare-header .delta {
      font-size: var(--fs-xs);
      font-weight: bold;
      flex-shrink: 0;
      padding: 1px 6px;
      border-radius: 3px;
    }
    .compare-header .delta.up { color: var(--color-warn); background: rgba(224, 62, 62, 0.10); }
    .compare-header .delta.down { color: #2ea043; background: rgba(46, 160, 67, 0.10); }
    .compare-header .delta.same { color: var(--color-text-muted); }
    .compare-bars {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: var(--fs-xs);
    }
    .bar-row .bar-label {
      width: 36px;
      color: var(--color-text-muted);
      flex-shrink: 0;
    }
    .bar-row .bar {
      flex: 1;
      height: 8px;
      background: var(--color-progress-track);
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-row .fill {
      display: block;
      height: 100%;
      border-radius: 4px;
      transition: width 0.2s;
    }
    .bar-row .bar-pct {
      width: 38px;
      text-align: right;
      font-weight: bold;
      color: var(--color-text-primary);
      flex-shrink: 0;
    }
    .bar-row.prev .bar-pct {
      color: var(--color-text-muted);
      font-weight: normal;
    }

    /* ===== Weekday bars (H: 분석 카드 outline) ===== */
    .weekday-card {
      padding: 12px 14px;
      background: transparent;
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
    }
    .weekday-bars {
      display: flex;
      gap: 4px;
      align-items: flex-end;
      height: 60px;
      margin-bottom: 8px;
    }
    .weekday-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      height: 100%;
    }
    .weekday-col .bar {
      width: 80%;
      background: var(--color-text-primary);
      border-radius: 3px 3px 0 0;
      min-height: 2px;
      transition: height 0.2s;
    }
    .weekday-col.weekend .bar {
      background: var(--color-warn);
      opacity: 0.6;
    }
    .weekday-col .day {
      font-size: var(--fs-xs);
      color: var(--color-text-muted);
    }
    .weekday-col.weekend .day {
      color: var(--color-warn);
    }
    .weekday-summary {
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      text-align: center;
      padding-top: 8px;
      border-top: 1px solid var(--color-border-tertiary);
    }

    /* ===== Weeks (G: 한 카드로 통합) ===== */
    .weeks-card {
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
    }
    .weeks-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--color-border-tertiary);
      font-size: var(--fs-sm);
    }
    .weeks-row:last-child { border-bottom: none; }
    .weeks-row.current {
      background: var(--color-background-primary);
      margin: 4px -8px;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid var(--color-border-tertiary);
    }
    .weeks-row.over .amount { color: var(--color-warn); }
    .weeks-row .label {
      color: var(--color-text-muted);
      width: 76px;
      flex-shrink: 0;
    }
    .weeks-row .label .week-num {
      color: var(--color-text-primary);
      font-weight: bold;
    }
    .weeks-row .progress {
      flex: 1;
      min-width: 40px;
    }
    .weeks-row .amount {
      width: 84px;
      text-align: right;
      font-weight: bold;
      flex-shrink: 0;
    }

    .progress {
      height: 6px;
      background: var(--color-progress-track);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      transition: width 0.2s;
      border-radius: 3px;
    }

    /* ===== Categories (stats view) — tree ===== */
    .category-view {
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      margin-bottom: 6px;
    }
    .category-view.child {
      margin-left: 18px;
      padding: 8px 12px;
      background: transparent;
      border-left: 2px solid var(--color-border-tertiary);
      border-radius: 0;
      margin-bottom: 4px;
    }
    .category-view.child + .category-view:not(.child) {
      margin-top: 12px;
    }
    .cv-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
    }
    .category-view.child .cv-header { margin-bottom: 4px; }
    .cv-emoji {
      font-size: 16px;
      line-height: 1;
      flex-shrink: 0;
    }
    .category-view.child .cv-emoji { font-size: 13px; }
    .cv-name {
      font-weight: bold;
      flex: 1;
      font-size: var(--fs-base);
    }
    .category-view.child .cv-name { font-size: var(--fs-sm); }
    .cv-amount {
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
    }
    .cv-amount .spent {
      color: var(--color-text-primary);
      font-weight: bold;
      font-size: var(--fs-base);
    }
    .category-view.child .cv-amount,
    .category-view.child .cv-amount .spent {
      font-size: var(--fs-xs);
    }

    /* ===== Transactions ===== */
    .tx-group { margin-bottom: 14px; }
    .tx-group:last-child { margin-bottom: 0; }
    .tx-group-header {
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      margin-bottom: 6px;
      padding-left: 4px;
    }
    .tx {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      margin-bottom: 6px;
    }
    .tx-body {
      flex: 1;
      min-width: 0;
    }
    .tx-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .tx-amount {
      font-weight: bold;
      font-size: var(--fs-amount);
    }
    .tx-raw {
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      word-break: break-all;
    }
    .tx-delete {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      border-radius: var(--border-radius-md);
      font-size: 18px;
      flex-shrink: 0;
    }
    .tx-delete:hover {
      background: var(--color-border-tertiary);
      color: var(--color-warn);
    }

    /* ===== Empty state ===== */
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 8px;
      line-height: 1;
    }
    .empty-message {
      color: var(--color-text-muted);
      font-size: var(--fs-sm);
    }

    /* ===== Badge ===== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: var(--fs-xs);
      font-weight: normal;
      flex-shrink: 0;
    }

    /* ===== Settings screen ===== */
    .screen[hidden] { display: none; }

    .settings-section { margin-bottom: 24px; }
    .settings-section:last-child { margin-bottom: 0; }
    .settings-section h3 {
      margin: 0 0 10px 0;
      padding: 4px 0 4px 10px;
      font-size: var(--fs-base);
      color: var(--color-text-primary);
      font-weight: bold;
      letter-spacing: 0.01em;
      border-left: 3px solid var(--color-text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 한도 추적 카드 (B) */
    .budget-tracking {
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      margin-bottom: 10px;
      border-left-width: 4px;
    }
    .bt-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .bt-emoji {
      font-size: 22px;
      line-height: 1;
      width: 28px;
      text-align: center;
      flex-shrink: 0;
    }
    .bt-text {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .bt-label {
      font-size: var(--fs-xs);
      color: var(--color-text-muted);
    }
    .bt-name {
      font-size: var(--fs-base);
      font-weight: bold;
    }
    .bt-usage {
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      flex-shrink: 0;
    }
    .bt-usage strong {
      color: var(--color-text-primary);
      font-weight: bold;
    }
    .bt-usage strong.over { color: var(--color-warn); }
    .bt-progress {
      height: 4px;
      background: var(--color-progress-track);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }
    .bt-progress-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.2s;
    }
    .bt-select-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--color-border-tertiary);
    }
    .bt-select-row .label {
      font-size: var(--fs-xs);
      color: var(--color-text-muted);
      flex-shrink: 0;
    }
    .bt-select-row select {
      flex: 1;
      min-height: 32px;
      padding: 0 8px;
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      font-family: inherit;
      font-size: var(--fs-sm);
    }

    .limit-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      margin-bottom: 6px;
      font-size: var(--fs-base);
    }
    .limit-row .label {
      flex: 1;
      color: var(--color-text-muted);
    }
    .limit-row input,
    .limit-row select {
      width: 130px;
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      font-family: inherit;
      font-size: var(--fs-base);
    }
    .limit-row input { text-align: right; }
    .limit-row input:focus,
    .limit-row select:focus { outline: none; border-color: var(--color-text-muted); }

    .settings-cat {
      padding: 8px 12px 8px 10px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      margin-bottom: 6px;
      border-left: 4px solid var(--color-border-tertiary);
    }
    .settings-cat[data-parent-id] {
      margin-left: 24px;
      padding: 6px 10px 6px 8px;
      border-left-width: 3px;
      position: relative;
    }
    /* 트리 connector (C) */
    .settings-cat[data-parent-id]::before {
      content: '';
      position: absolute;
      left: -16px;
      top: 18px;
      width: 12px;
      height: 1px;
      background: var(--color-border-tertiary);
    }
    .settings-cat[data-parent-id]::after {
      content: '';
      position: absolute;
      left: -16px;
      top: -3px;
      bottom: 50%;
      width: 1px;
      background: var(--color-border-tertiary);
    }
    .cat-summary-line {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      min-height: 32px;
    }
    .cat-summary-line .sum-emoji {
      font-size: 18px;
      width: 24px;
      text-align: center;
      flex-shrink: 0;
      line-height: 1;
    }
    .settings-cat[data-parent-id] .sum-emoji { font-size: 14px; width: 20px; }
    .cat-summary-line .sum-emoji.empty { opacity: 0.3; }
    .cat-summary-line .sum-name {
      font-weight: bold;
      font-size: var(--fs-base);
      flex-shrink: 0;
    }
    .settings-cat[data-parent-id] .sum-name { font-size: var(--fs-sm); }
    .cat-summary-line .sum-meta {
      flex: 1;
      color: var(--color-text-muted);
      font-size: var(--fs-sm);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
    }
    .settings-cat[data-parent-id] .sum-meta { font-size: var(--fs-xs); }
    .cat-summary-line .sum-chevron {
      color: var(--color-text-muted);
      transition: transform 0.2s;
      font-size: 12px;
      flex-shrink: 0;
      width: 12px;
      text-align: center;
    }
    .settings-cat:not(.collapsed) .sum-chevron {
      transform: rotate(90deg);
    }
    .cat-edit-block {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--color-border-tertiary);
    }
    .settings-cat.collapsed .cat-edit-block {
      display: none;
    }
    .settings-cat-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .settings-cat input,
    .settings-cat select {
      font-family: inherit;
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
    }
    .settings-cat input:focus,
    .settings-cat select:focus { outline: none; border-color: var(--color-text-muted); }
    .settings-cat .emoji-input {
      width: 48px;
      min-height: 36px;
      padding: 0;
      text-align: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .settings-cat .name-input {
      flex: 1;
      min-width: 0;
      min-height: 36px;
      padding: 0 10px;
      font-size: var(--fs-base);
      font-weight: bold;
    }
    .settings-cat .kw-input {
      width: 100%;
      min-height: 36px;
      padding: 0 10px;
      font-size: var(--fs-sm);
      margin-bottom: 8px;
    }
    .settings-cat .budget-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
    }
    .settings-cat .budget-row input {
      width: 130px;
      min-height: 36px;
      padding: 0 10px;
      font-size: var(--fs-base);
      text-align: right;
    }
    .settings-cat .parent-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      margin-top: 8px;
    }
    .settings-cat .parent-row select {
      flex: 1;
      min-height: 36px;
      padding: 0 8px;
      font-size: var(--fs-sm);
    }
    .settings-cat-delete {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      border-radius: var(--border-radius-md);
      font-size: 18px;
      flex-shrink: 0;
    }
    .settings-cat-delete:hover {
      background: var(--color-border-tertiary);
      color: var(--color-warn);
    }

    .add-cat-trigger {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border: 1px dashed var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--fs-base);
      margin-top: 4px;
    }
    .add-cat-trigger:hover {
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
    }

    .add-cat-panel {
      margin-top: 8px;
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .add-cat-panel .row1 {
      display: flex;
      gap: 8px;
    }
    .add-cat-panel input,
    .add-cat-panel select {
      font-family: inherit;
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
    }
    .add-cat-panel input:focus,
    .add-cat-panel select:focus { outline: none; border-color: var(--color-text-muted); }
    .add-cat-panel .emoji {
      width: 56px;
      min-height: 44px;
      padding: 0;
      text-align: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .add-cat-panel .name {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      padding: 0 12px;
      font-size: var(--fs-base);
    }
    .add-cat-panel .kw,
    .add-cat-panel .budget,
    .add-cat-panel .parent {
      min-height: 44px;
      padding: 0 12px;
      font-size: var(--fs-base);
    }
    .panel-actions {
      display: flex;
      gap: 8px;
    }
    .panel-actions button {
      flex: 1;
      min-height: 44px;
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--fs-base);
    }
    .panel-actions .primary {
      background: var(--color-text-primary);
      color: var(--color-background-primary);
      border-color: var(--color-text-primary);
      font-weight: bold;
    }

    /* ===== Data section ===== */
    .data-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .data-actions button {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--fs-base);
      text-align: left;
    }
    .data-actions button:hover {
      background: var(--color-border-tertiary);
    }
    .data-actions button.danger {
      color: var(--color-warn);
    }
    .data-actions .data-hint {
      font-size: var(--fs-xs);
      color: var(--color-text-muted);
      padding: 0 4px;
    }
    .import-input { display: none; }

    /* ===== Emoji picker modal ===== */
    .emoji-modal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      border-radius: var(--border-radius-md);
    }
    .emoji-modal[hidden] { display: none; }
    .emoji-modal-content {
      background: var(--color-background-primary);
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      padding: 14px;
      max-width: calc(100% - 24px);
      max-height: 80%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .emoji-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .emoji-modal-header h3 {
      margin: 0;
      font-size: var(--fs-base);
    }
    .emoji-modal-close {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      border-radius: var(--border-radius-md);
      font-size: 18px;
    }
    .emoji-modal-close:hover {
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
    }
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      overflow-y: auto;
      max-height: 280px;
      padding: 2px;
    }
    .emoji-grid button {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 20px;
      border-radius: 4px;
      padding: 0;
      font-family: inherit;
    }
    .emoji-grid button:hover {
      background: var(--color-background-secondary);
    }
    .emoji-modal-footer {
      display: flex;
      gap: 6px;
    }
    .emoji-modal-footer button {
      flex: 1;
      min-height: 36px;
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--fs-sm);
    }
    .emoji-modal-footer button:hover {
      background: var(--color-border-tertiary);
    }
    /* 이모지 input은 picker 트리거 전용 */
    .settings-cat .emoji-input,
    .add-cat-panel .emoji {
      cursor: pointer;
      caret-color: transparent;
    }

    /* ===== Toast ===== */
    .toast {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      background: var(--color-text-primary);
      color: var(--color-background-primary);
      border-radius: var(--border-radius-md);
      font-size: var(--fs-sm);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      max-width: 90%;
      text-align: center;
      z-index: 10;
      white-space: nowrap;
    }
    .toast.visible { opacity: 0.95; }
  </style>
</head>
<body>
<main class="widget">
  <header class="top-header">
    <div class="header-left">
      <h1>가계부</h1>
      <span class="cloud-status" data-tone="" title="로컬 저장만">⌂</span>
    </div>
    <div class="header-right">
      <button class="icon-btn stats-btn" type="button" aria-label="현황">📊</button>
      <button class="icon-btn settings-btn" type="button" aria-label="설정">⚙</button>
    </div>
  </header>

  <!-- ===== Home screen ===== -->
  <div class="screen screen-home">
    <section class="hero">
      <span class="hero-label">남은 예산</span>
      <span class="hero-amount">0원</span>
      <span class="hero-meta"></span>
    </section>

    <section class="input-section">
      <div class="quick-dates">
        <button type="button" data-chip="오늘">오늘</button>
        <button type="button" data-chip="어제">어제</button>
        <button type="button" data-chip="그제">그제</button>
        <button type="button" class="custom-date-btn" aria-label="날짜 선택">+</button>
      </div>
      <div class="input-row">
        <input id="entry" type="text" placeholder="예: 점심 김밥 5,000" autocomplete="off" />
        <button id="add-btn" type="button">추가</button>
      </div>
    </section>

    <section class="home-donut-section">
      <h2 class="section-title">카테고리 비율</h2>
      <div class="home-donut-host"></div>
    </section>

    <section class="pace-section">
      <h2 class="section-title">지출 페이스</h2>
      <div class="pace-host"></div>
    </section>

    <section class="week-budget-section">
      <h2 class="section-title">이번 주 한도</h2>
      <div class="week-budget-host"></div>
    </section>

    <section class="transactions">
      <h2 class="section-title">최근 내역</h2>
      <div class="tx-list"></div>
      <div class="empty-state" hidden>
        <div class="empty-icon">📒</div>
        <div class="empty-message">오늘 지출이 아직 없어요</div>
      </div>
    </section>
  </div>

  <!-- ===== Stats screen ===== -->
  <div class="screen screen-stats" hidden>
    <header class="sub-header">
      <button class="icon-btn back-btn-stats" type="button" aria-label="뒤로">←</button>
      <h2>현황</h2>
    </header>

    <div class="month-nav">
      <button class="nav-prev" type="button" aria-label="이전 달">←</button>
      <span class="nav-label">2026년 4월</span>
      <button class="nav-next" type="button" aria-label="다음 달">→</button>
    </div>

    <section class="hero stats-hero">
      <span class="hero-label">남은 예산</span>
      <span class="hero-amount stats-hero-amount">0원</span>
      <span class="hero-meta stats-hero-meta"></span>
    </section>

    <section class="categories-section">
      <h2 class="section-title">카테고리별 지출</h2>
      <div class="category-list"></div>
    </section>

    <section class="weeks-section">
      <h2 class="section-title">주차별 지출</h2>
      <div class="weeks"></div>
    </section>

    <section class="cat-compare-section">
      <h2 class="section-title">지난달 카테고리 비율 비교</h2>
      <div class="cat-compare-host"></div>
    </section>

    <section class="weekday-section">
      <h2 class="section-title">요일별 패턴</h2>
      <div class="weekday-host"></div>
    </section>
  </div>

  <!-- ===== Settings screen ===== -->
  <div class="screen screen-settings" hidden>
    <header class="sub-header">
      <button class="icon-btn back-btn-settings" type="button" aria-label="뒤로">←</button>
      <h2>설정</h2>
    </header>

    <div class="settings-section">
      <h3>💰 예산 한도</h3>
      <div class="budget-tracking-host"></div>
      <div class="limit-row">
        <span class="label">주 한도</span>
        <input type="number" inputmode="numeric" name="weekLimit" />
        <span>원</span>
      </div>
    </div>

    <div class="settings-section">
      <h3>🏷 카테고리 관리</h3>
      <div class="settings-category-list"></div>
      <button class="add-cat-trigger" type="button">+ 카테고리 추가</button>
      <div class="add-cat-panel" hidden>
        <div class="row1">
          <input class="emoji" type="text" maxlength="4" placeholder="🔖" readonly />
          <input class="name" type="text" placeholder="이름" />
        </div>
        <select class="parent">
          <option value="">상위 카테고리 (최상위)</option>
        </select>
        <input class="kw" type="text" placeholder="키워드 (쉼표 구분)" />
        <input class="budget" type="number" inputmode="numeric" placeholder="예산 (원, 0이면 부모 예산 따름)" />
        <div class="panel-actions">
          <button class="primary" type="button" data-action="confirm">추가</button>
          <button class="ghost" type="button" data-action="cancel">취소</button>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <h3>💾 데이터 관리</h3>
      <div class="data-actions">
        <button type="button" data-action="export">📤 JSON 내보내기</button>
        <button type="button" data-action="import">📥 JSON 가져오기</button>

<script>
(function () {

  // ===== Cloud sync constants =====
  var WORKER_URL = 'https://notion-widgets-api.wldnjsdkk.workers.dev';

  // ===== Schema =====

  var KEYS = {

  var DATE_KEYWORDS = [
    { word: '그저께', offset: -2 },
    { word: '그제',   offset: -2 },
    { word: '어제',   offset: -1 },
    { word: '오늘',   offset:  0 }
  ];

  var DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];

  var EMOJI_LIST = [
    // 주거/생활
    '🏠','🏡','🏢','🛏','🚪','🪑','💡','🔌',
    // 돈
    '💰','💵','💴','💸','💳','🏦','📈','📉',
    // 음식
    '🍚','🍙','🍣','🍔','🍕','🍜','🍟','🍱','🍝','🍞','🥗','🥘','🥪','🍖','🍗','🥟','🍙','🌮','🍰','🧁',
    // 음료
    '☕','🥤','🧋','🍵','🥛','🍺','🍷','🍶','🥃','🍸','🍹',
    // 약속/이벤트/사람
    '🎉','💝','💕','❤️','💌','🌹','💐','🎁','🥂','💏',
    // 놀이/엔터
    '🎮','🎬','🎤','🎵','🎯','🎨','🎷','🎸','🎲','📚','🎳','🎰',
    // 교통
    '🚇','🚌','🚕','🚗','🛵','🚲','✈️','🚆','⛽','🛴',
    // 쇼핑/패션
    '🛍','🛒','👕','👖','👟','👜','👓','💄','👑','💍',
    // 전자/일
    '📱','💻','🖥','📺','🎧','📷','⌚','🖱','📒','📋','📝','✏️',
    // 담배/술
    '🚬','🚭',
    // 건강/뷰티
    '🩺','💊','🏥','💉','🦷','🧴','💆','💇',
    // 운동
    '⚽','🏀','🎾','🏊','🏃','🧘','🏋️','🚴',
    // 동물·자연
    '🐶','🐱','🐰','🐯','🌳','🌸','🌷','🌻','☀️','🌙','❄️','🔥','💧','🌈',
    // 별·기타
    '🌟','✨','💫','🔆','🎒','📦','🔖','🏷'
  ];

  // ===== State =====
  var state = {
    categories: [],
    transactions: [],
    meta: { schemaVersion: SCHEMA_VERSION, nextTxId: 1, nextCatId: 1, weekLimit: DEFAULT_WEEK_LIMIT, budgetCategoryId: null }
  };

  var viewMonth = null;

  // ===== Cloud sync state =====
  var cloudPageId = null;
  var cloudKey = null;
  var cloudEnabled = false;
  var cloudSaveTimer = null;
  var cloudInFlight = false;
  var cloudPendingSave = false;
  var cloudApplyingRemote = false;

  function defaultState() {
    return {
      categories: [
        // 고정지출 (상위 + 하위 4개)
        { id: 1,  name: '고정지출',   emoji: '🏠', keywords: [], budget: 800000, color: 'gray', parentId: null },
        { id: 2,  name: '월세',       emoji: '🏡', keywords: ['월세','관리비','임대료'], budget: 0, color: 'gray', parentId: 1 },
        { id: 3,  name: '전기/가스비', emoji: '💡', keywords: ['전기','가스','수도','전기세','가스비'], budget: 0, color: 'gray', parentId: 1 },
        { id: 4,  name: '통신비',     emoji: '📱', keywords: ['통신비','핸드폰','휴대폰','인터넷','와이파이','요금제'], budget: 0, color: 'gray', parentId: 1 },
        { id: 5,  name: '구독료',     emoji: '📺', keywords: ['구독','넷플릭스','유튜브','왓챠','쿠팡플레이','디즈니','애플뮤직','스포티파이','챗gpt'], budget: 0, color: 'gray', parentId: 1 },

        // 담배
        { id: 6,  name: '담배',       emoji: '🚬', keywords: ['담배','전자담배','릴','연초'], budget: 150000, color: 'brown', parentId: null },

        // 생활비 (상위 + 하위 4개)
        { id: 7,  name: '생활비',     emoji: '💰', keywords: [], budget: 1000000, color: 'orange', parentId: null },
        { id: 8,  name: '식비',       emoji: '🍚', keywords: ['식비','점심','저녁','아침','식당','김밥','분식','배달','편의점','마트','장보기'], budget: 0, color: 'orange', parentId: 7 },
        { id: 9,  name: '커피',       emoji: '☕', keywords: ['커피','카페','아메리카노','라떼','스타벅스','메가','컴포즈','이디야','투썸'], budget: 0, color: 'pink', parentId: 7 },
        { id: 10, name: '약속',       emoji: '🎉', keywords: ['약속','데이트','선물','꽃','노래방','영화','게임','피시방','PC방','쇼핑','옷','술','맥주','소주','와인'], budget: 0, color: 'purple', parentId: 7 },
        { id: 11, name: '교통비',     emoji: '🚇', keywords: ['교통','교통비','택시','지하철','버스','주유','기름'], budget: 0, color: 'yellow', parentId: 7 },

        // 저축
        { id: 12, name: '저축',       emoji: '💵', keywords: ['저축','적금','비상금','입금'], budget: 550000, color: 'green', parentId: null },

        // 기타 (fallback) — 생활비 자식으로 두어 한도 평균에 포함
        { id: 13, name: '기타',       emoji: '🔖', keywords: [], budget: 0, color: 'blue', parentId: 7 }
      ],
      transactions: [],
      meta: {
        schemaVersion: SCHEMA_VERSION,
        nextTxId: 1,
        nextCatId: 14,
        weekLimit: DEFAULT_WEEK_LIMIT,
        budgetCategoryId: 7  // 생활비
      }
    };
  }

  function migrate(loaded) {
    loaded.categories = (loaded.categories || []).map(function(c) {
      if (!('emoji' in c)) c.emoji = '';
      if (!('parentId' in c)) c.parentId = null;
      return c;
    });
    loaded.transactions = loaded.transactions || [];
    loaded.meta = loaded.meta || {};
    if (typeof loaded.meta.schemaVersion !== 'number') loaded.meta.schemaVersion = SCHEMA_VERSION;
    if (typeof loaded.meta.nextTxId !== 'number') loaded.meta.nextTxId = 1;
    if (typeof loaded.meta.nextCatId !== 'number') loaded.meta.nextCatId = 1;
    if (typeof loaded.meta.weekLimit !== 'number') loaded.meta.weekLimit = DEFAULT_WEEK_LIMIT;
    // 일회성: 기본 '기타'(id=13) 카테고리를 생활비(id=7) 자식으로 이동
    if (!loaded.meta.etcUnderBudgetMigrated) {
      for (var ei = 0; ei < loaded.categories.length; ei++) {
        var ec = loaded.categories[ei];
        if (ec.id === 13 && ec.name === '기타' && ec.parentId === null) {
          ec.parentId = 7;
          break;
        }
      }
      loaded.meta.etcUnderBudgetMigrated = true;
    }
    // budgetCategoryId 검증: 없거나 잘못됐으면 '생활비' 또는 첫 카테고리
    var hasValid = typeof loaded.meta.budgetCategoryId === 'number' &&
      loaded.categories.some(function(c) { return c.id === loaded.meta.budgetCategoryId; });
    if (!hasValid) {
      var seoul = null;
      for (var i = 0; i < loaded.categories.length; i++) {
        if (loaded.categories[i].name === '생활비') { seoul = loaded.categories[i]; break; }
      }
      loaded.meta.budgetCategoryId = seoul ? seoul.id : (loaded.categories[0] ? loaded.categories[0].id : null);
    }
    return loaded;
  }

  function loadStateLocal() {
    try {
      var meta = localStorage.getItem(KEYS.META);
      if (meta) {
        var parsedMeta = JSON.parse(meta);
        if (parsedMeta && parsedMeta.schemaVersion === SCHEMA_VERSION) {
          var cats = localStorage.getItem(KEYS.CATEGORIES);
          var txs  = localStorage.getItem(KEYS.TRANSACTIONS);
          if (cats && txs) {
            return migrate({
              categories: JSON.parse(cats),
              transactions: JSON.parse(txs),
              meta: parsedMeta
            });
          }
        }
        // 옛 스키마 → reset (사용자 결정: 모두 삭제)
      }
    } catch (err) {
      console.warn('가계부 데이터 로드 실패, 기본값 사용', err);
    }
    return defaultState();
  }

  function saveStateLocal() {
    try {
      localStorage.setItem(KEYS.CATEGORIES, JSON.stringify(state.categories));
      localStorage.setItem(KEYS.TRANSACTIONS, JSON.stringify(state.transactions));
      localStorage.setItem(KEYS.META, JSON.stringify(state.meta));
    } catch (err) {
      console.warn('가계부 데이터 저장 실패 (인메모리 유지)', err);
    }
  }

  function saveState() {
    saveStateLocal();
    if (cloudEnabled && !cloudApplyingRemote) {
      cloudScheduleSave();
    }
  }

  // ===== Cloud sync functions =====
  function cloudReadParams() {
    try {
      var sp = new URLSearchParams(location.search);
      var hashRaw = (location.hash || '').replace(/^#/, '');
      var hp = new URLSearchParams(hashRaw);
      cloudPageId = sp.get('np') || sp.get('page') || hp.get('np') || hp.get('page') || 'main';
      cloudKey = sp.get('nk') || sp.get('key') || hp.get('nk') || hp.get('key') || WIDGET_API_KEY || null;
      var workerOk = typeof WORKER_URL === 'string' && WORKER_URL && WORKER_URL.indexOf('REPLACE-ME') === -1;
      cloudEnabled = !!(cloudPageId && workerOk);
    } catch (e) { cloudEnabled = false; }
  }

  function cloudHeaders() {
    var h = { 'Content-Type': 'application/json' };
    if (cloudKey) h['X-Widget-Key'] = cloudKey;
    return h;
  }

  function cloudUrl() {
    return WORKER_URL.replace(/\/+$/, '') + '/budget-state?space=' + encodeURIComponent(cloudPageId);
  }

  function setCloudStatus(icon, tone, title) {
    var el = widget && widget.querySelector('.cloud-status');
    if (!el) return;
    el.textContent = icon;
    el.dataset.tone = tone || '';
    if (title) el.title = title;
    el.hidden = (icon === '⌂');
  }

  function cloudLoad() {
    if (!cloudEnabled) return Promise.resolve(null);
    setCloudStatus('⟳', 'pending', '동기화 중…');
    return fetch(cloudUrl(), { method: 'GET', headers: cloudHeaders() })
      .then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function(data) {
        setCloudStatus('☁', 'ok', '동기화됨 · ' + new Date().toLocaleTimeString('ko-KR'));
        return (data && data.state) || null;
      })
      .catch(function(e) {
        setCloudStatus('!', 'err', '동기화 실패: ' + (e && e.message || e));
        console.warn('[cloud] load failed:', e);
        return null;
      });
  }

  function cloudSaveNow() {
    if (!cloudEnabled) return Promise.resolve();
    if (cloudInFlight) { cloudPendingSave = true; return Promise.resolve(); }
    cloudInFlight = true;
    setCloudStatus('⟳', 'pending', '저장 중…');
    return fetch(cloudUrl(), { method: 'PUT', headers: cloudHeaders(), body: JSON.stringify(state) })
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        setCloudStatus('☁', 'ok', '동기화됨 · ' + new Date().toLocaleTimeString('ko-KR'));
      })
      .catch(function(e) {
        setCloudStatus('!', 'err', '저장 실패: ' + (e && e.message || e));
        console.warn('[cloud] save failed:', e);
      })
      .then(function() {
        cloudInFlight = false;
        if (cloudPendingSave) { cloudPendingSave = false; cloudScheduleSave(); }
      });
  }

  function cloudScheduleSave() {
    if (!cloudEnabled) return;
    if (cloudApplyingRemote) return;
    if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
    cloudSaveTimer = setTimeout(cloudSaveNow, SAVE_DEBOUNCE_MS);
  }

  function initCloudSync(onRemoteApplied) {
    cloudReadParams();
    if (!cloudEnabled) {
      var reason = !cloudPageId ? '로컬 저장만 (URL에 ?np=... 없음)' : '로컬 저장만 (Worker URL 미설정)';
      setCloudStatus('⌂', '', reason);
      return Promise.resolve(false);
    }
    cloudApplyingRemote = true;
    return cloudLoad().then(function(remote) {
      cloudApplyingRemote = false;
      if (remote) { if (typeof onRemoteApplied === 'function') onRemoteApplied(remote); }
      else { cloudScheduleSave(); }
      return true;
    }).catch(function() { cloudApplyingRemote = false; return false; });
  }

  // ===== Utilities =====
  function formatMoney(n) { return Math.round(n).toLocaleString('ko-KR') + '원'; }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function todayStr() { return ymd(new Date()); }
  function offsetDate(offset) { var d = new Date(); d.setDate(d.getDate() + offset); return ymd(d); }
  function monthKey(dateStr) { return dateStr.slice(0, 7); }
  function getWeekIndex(dateStr) {
    var day = parseInt(dateStr.slice(8, 10), 10);
    return Math.min(3, Math.floor((day - 1) / 7));
  }
  function currentMonthKey() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
  function shiftMonth(mk, delta) {
    var p = mk.split('-');
    var y = parseInt(p[0], 10);
    var m = parseInt(p[1], 10) - 1 + delta;
    var d = new Date(y, m, 1);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
  }
  function formatMonthLabel(mk) {
    var p = mk.split('-');
    return p[0] + '년 ' + parseInt(p[1], 10) + '월';
  }
  function formatTxDate(dateStr) {
    if (dateStr === todayStr()) return '오늘';
    if (dateStr === offsetDate(-1)) return '어제';
    if (dateStr === offsetDate(-2)) return '그저께';
    var p = dateStr.split('-');
    return parseInt(p[1], 10) + '월 ' + parseInt(p[2], 10) + '일';
  }
  function daysInMonth(mk) {
    var p = mk.split('-');
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10), 0).getDate();
  }
  function dayOfWeek(dateStr) {
    var p = dateStr.split('-');
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)).getDay();
  }
  function getCategoryById(id) {
    for (var i = 0; i < state.categories.length; i++) {
      if (state.categories[i].id === id) return state.categories[i];
    }
    return null;
  }
  function getEtcCategory() {
    for (var i = 0; i < state.categories.length; i++) {
      if (state.categories[i].name === '기타') return state.categories[i];
    }
    return null;
  }
  function getChildren(parentId) {
    return state.categories.filter(function(c) { return c.parentId === parentId; });
  }
  function getBudgetCat() {
    return getCategoryById(state.meta.budgetCategoryId);
  }
  function getBudgetCatIds() {
    // 한도 추적 카테고리 + 자식 ID 모두
    var rootId = state.meta.budgetCategoryId;
    if (rootId == null) return [];
    var ids = [rootId];
    state.categories.forEach(function(c) {
      if (c.parentId === rootId) ids.push(c.id);
    });
    return ids;
  }
  function isInBudgetScope(t) {
    var ids = getBudgetCatIds();
    return ids.indexOf(t.categoryId) !== -1;
  }
  function getBudgetLimit() {
    var cat = getBudgetCat();
    return cat ? cat.budget : 0;
  }
  function getCategorySpent(catId, mk) {
    var ids = [catId];
    state.categories.forEach(function(c) {
      if (c.parentId === catId) ids.push(c.id);
    });
    return state.transactions.filter(function(t) {
      return ids.indexOf(t.categoryId) !== -1 && monthKey(t.date) === mk;
    }).reduce(function(s,t) { return s + t.amount; }, 0);
  }
  function progressColor(ratio, baseHex) {
    if (ratio >= 1) return COLOR_HEX.red.text;
    if (ratio >= 0.8) return COLOR_HEX.yellow.text;
    return baseHex;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[ch];
    });
  }
  function badgeHtml(category) {
    var c = COLOR_HEX[category.color] || COLOR_HEX.gray;
    var emoji = category.emoji ? escapeHtml(category.emoji) + ' ' : '';
    return '<span class="badge" style="background-color: rgba(' + c.rgb + ', 0.25); color: ' + c.text + '">' + emoji + escapeHtml(category.name) + '</span>';
  }
  function autoCommaText(text) {
    return text.replace(/\d[\d,]*\d|\d/g, function(m) {
      var n = parseInt(m.replace(/,/g, ''), 10);
      if (!Number.isFinite(n)) return m;
      return n.toLocaleString('ko-KR');
    });
  }

  // ===== Parsers =====
  function parseDate(text) {
    for (var i = 0; i < DATE_KEYWORDS.length; i++) {
      var k = DATE_KEYWORDS[i];
      var idx = text.indexOf(k.word);
      if (idx !== -1) {
        return { date: offsetDate(k.offset), remainText: text.slice(0, idx) + text.slice(idx + k.word.length) };
      }
    }
    var md = text.match(/(\d{1,2})월\s*(\d{1,2})일/);
    if (md) {
      var now = new Date();
      var mNum = parseInt(md[1], 10);
      var dNum = parseInt(md[2], 10);
      var picked = new Date(now.getFullYear(), mNum - 1, dNum);
      if (picked.getTime() - now.getTime() > 86400000 * 7) {
        picked = new Date(now.getFullYear() - 1, mNum - 1, dNum);
      }
      return {
        date: ymd(picked),
        remainText: text.slice(0, md.index) + text.slice(md.index + md[0].length)
      };
    }
    return { date: todayStr(), remainText: text };
  }
  function parseAmount(text) {
    var re = /\d[\d,]*/;
    var m = text.match(re);
    if (!m) return { amount: null, remainText: text };
    var amount = parseInt(m[0].replace(/,/g, ''), 10);
    if (!Number.isFinite(amount) || amount <= 0) return { amount: null, remainText: text };
    return { amount: amount, remainText: text.slice(0, m.index) + text.slice(m.index + m[0].length) };
  }
  function matchCategory(text, categories) {
    for (var i = 0; i < categories.length; i++) {
      var c = categories[i];
      if (c.keywords && c.keywords.length) {
        for (var j = 0; j < c.keywords.length; j++) {
          var k = c.keywords[j];
          if (k && text.indexOf(k) !== -1) return c.id;
        }
      }
    }
    var etc = null;
    for (var n = 0; n < categories.length; n++) {
      if (categories[n].name === '기타') { etc = categories[n]; break; }
    }
    if (etc) return etc.id;
    return categories.length > 0 ? categories[0].id : null;
  }
  function parseEntry(rawText) {
    var trimmed = (rawText || '').trim();
    if (!trimmed) return null;
    var dateRes = parseDate(trimmed);
    var amountRes = parseAmount(dateRes.remainText);
    if (amountRes.amount === null) return null;
    var categoryId = matchCategory(amountRes.remainText, state.categories);
    if (categoryId === null) return null;
    return { amount: amountRes.amount, date: dateRes.date, categoryId: categoryId, rawText: trimmed };
  }

  // ===== Donut chart =====
  function renderDonutSvg(items, totalSpent, centerPct) {
    var R = 40;
    var circumference = 2 * Math.PI * R;
    var html = '<svg viewBox="0 0 100 100" class="donut">';
    html += '<circle cx="50" cy="50" r="' + R + '" fill="none" stroke="var(--color-progress-track)" stroke-width="14"/>';
    if (items && items.length > 0 && totalSpent > 0) {
      var offsetSum = 0;
      items.forEach(function(item) {
        if (item.amount <= 0) return;
        var pct = item.amount / totalSpent;
        var len = pct * circumference;
        var offsetLen = offsetSum * circumference;
        var color = (COLOR_HEX[item.color] || COLOR_HEX.gray).text;
        html += '<circle cx="50" cy="50" r="' + R + '" fill="none" stroke="' + color +
                '" stroke-width="14" stroke-dasharray="' + len.toFixed(2) + ' ' + circumference.toFixed(2) +
                '" stroke-dashoffset="' + (-offsetLen).toFixed(2) +
                '" transform="rotate(-90 50 50)" />';
        offsetSum += pct;
      });
    }
    html += '</svg>';
    html += '<div class="donut-center"><span class="pct">' + centerPct + '%</span><span class="label">월 사용</span></div>';
    return html;
  }

  function renderBudgetDonutInto(host, mk) {
    var rootId = state.meta.budgetCategoryId;
    var rootCat = getBudgetCat();
    // 도넛에 표시할 카테고리: 한도 추적 카테고리의 자식들 (없으면 자기 자신만)
    var children = getChildren(rootId);
    var slices = (children.length > 0 ? children : (rootCat ? [rootCat] : []));

    var monthTxs = state.transactions.filter(function(t) { return monthKey(t.date) === mk; });
    var totalSpent = 0;
    var items = slices.map(function(cat) {
      var sum = monthTxs.filter(function(t) { return t.categoryId === cat.id; })
        .reduce(function(s,t) { return s + t.amount; }, 0);
      totalSpent += sum;
      return { cat: cat, amount: sum, color: cat.color };
    });

    var limit = getBudgetLimit();
    var centerPct = limit > 0 ? Math.round((totalSpent / limit) * 100) : 0;

    if (totalSpent === 0) {
      var rootName = rootCat ? rootCat.name : '한도 카테고리';
      host.innerHTML = '<div class="cat-summary-empty">이 달 ' + escapeHtml(rootName) + ' 기록이 없어요</div>';
      return;
    }

    var sortedForLabels = items.slice().sort(function(a, b) { return b.amount - a.amount; });
    var donutHtml = renderDonutSvg(items, totalSpent, centerPct);
    var labelsHtml = sortedForLabels.map(function(it) {
      var pct = totalSpent > 0 ? Math.round((it.amount / totalSpent) * 100) : 0;
      var c = (COLOR_HEX[it.color] || COLOR_HEX.gray).text;
      var emoji = it.cat.emoji ? escapeHtml(it.cat.emoji) + ' ' : '';
      return '<div class="cat-label">' +
        '<span class="dot" style="background:' + c + '"></span>' +
        '<span class="name">' + emoji + escapeHtml(it.cat.name) + '</span>' +
        '<span class="pct">' + pct + '%</span>' +
      '</div>';
    }).join('');

    host.innerHTML =
      '<div class="cat-summary">' +
        '<div class="donut-wrap">' + donutHtml + '</div>' +
        '<div class="cat-labels">' + labelsHtml + '</div>' +
      '</div>';
  }

  function renderPaceCard() {
    var month = currentMonthKey();
    var spent = getCategorySpent(state.meta.budgetCategoryId, month);
    var limit = getBudgetLimit();
    var budgetCat = getBudgetCat();
    var rootName = budgetCat ? budgetCat.name : '한도';

    var today = new Date();
    var dim = daysInMonth(month);
    var elapsed = today.getDate();
    var remainingDays = Math.max(0, dim - elapsed);

    var actualAvg = elapsed > 0 ? spent / elapsed : 0;
    var recommendedAvg = dim > 0 ? limit / dim : 0;

    var actualClass = '';
    if (actualAvg > recommendedAvg * 1.05) actualClass = 'over';
    else if (actualAvg < recommendedAvg * 0.95 && spent > 0) actualClass = 'under';

    var forecastHtml = '';
    if (spent <= 0) {
      forecastHtml = '<div class="pace-forecast">아직 ' + escapeHtml(rootName) + ' 지출이 없어 추세를 못 잡아요</div>';
    } else if (limit <= 0) {
      forecastHtml = '<div class="pace-forecast">한도 미설정</div>';
    } else if (spent >= limit) {
      forecastHtml = '<div class="pace-forecast warn">이미 ' + escapeHtml(rootName) + ' 한도를 ' + formatMoney(spent - limit) + ' 넘었어요</div>';
    } else {
      var remainingBudget = limit - spent;
      var daysToLimit = actualAvg > 0 ? Math.ceil(remainingBudget / actualAvg) : Infinity;
      if (daysToLimit > remainingDays || !Number.isFinite(daysToLimit)) {
        var predictedTotal = actualAvg * dim;
        var predictedRemaining = limit - predictedTotal;
        forecastHtml = '<div class="pace-forecast ok">이 추세대로면 월말까지 ' +
          formatMoney(Math.max(0, predictedRemaining)) + ' 남아요</div>';
      } else {
        var reachDay = elapsed + daysToLimit;
        if (reachDay > dim) reachDay = dim;
        forecastHtml = '<div class="pace-forecast warn">이 추세대로면 ' +
          parseInt(month.split('-')[1], 10) + '월 ' + reachDay + '일에 한도 도달</div>';
      }
    }

    paceHost.innerHTML =
      '<div class="pace-card">' +
        '<div class="pace-row">' +
          '<div class="pace-col ' + actualClass + '">' +
            '<span class="pace-label">실제 평균</span>' +
            '<span class="pace-value">' + formatMoney(actualAvg) + '/일</span>' +
          '</div>' +
          '<div class="pace-col">' +
            '<span class="pace-label">권장 평균</span>' +
            '<span class="pace-value">' + formatMoney(recommendedAvg) + '/일</span>' +
          '</div>' +
        '</div>' +
        forecastHtml +
      '</div>';
  }

  function renderCatCompare() {
    // 한도 추적 카테고리의 자식들 비교 (없으면 최상위 카테고리들)
    var rootId = state.meta.budgetCategoryId;
    var children = getChildren(rootId);
    var compareCats = (children.length > 0 ? children : state.categories.filter(function(c) { return c.parentId === null && c.name !== '기타'; }));

    var prevMonth = shiftMonth(viewMonth, -1);
    var curTxs = state.transactions.filter(function(t) { return monthKey(t.date) === viewMonth; });
    var prevTxs = state.transactions.filter(function(t) { return monthKey(t.date) === prevMonth; });

    var curTotal = 0, prevTotal = 0;
    var rows = compareCats.map(function(cat) {
      var cur = curTxs.filter(function(t) { return t.categoryId === cat.id; })
        .reduce(function(s,t) { return s + t.amount; }, 0);
      var prev = prevTxs.filter(function(t) { return t.categoryId === cat.id; })
        .reduce(function(s,t) { return s + t.amount; }, 0);
      curTotal += cur;
      prevTotal += prev;
      return { cat: cat, cur: cur, prev: prev };
    });

    if (curTotal === 0 && prevTotal === 0) {
      catCompareHost.innerHTML = '<div class="cat-summary-empty">비교할 데이터가 없어요</div>';
      return;
    }

    var html = rows.map(function(r) {
      var curPct = curTotal > 0 ? Math.round((r.cur / curTotal) * 100) : 0;
      var prevPct = prevTotal > 0 ? Math.round((r.prev / prevTotal) * 100) : 0;
      var delta = curPct - prevPct;
      var emoji = r.cat.emoji ? escapeHtml(r.cat.emoji) + ' ' : '';
      var deltaText, deltaClass;
      if (r.cur === 0 && r.prev === 0) { deltaText = '–'; deltaClass = 'same'; }
      else if (delta > 0) { deltaText = '▲ ' + delta + '%p'; deltaClass = 'up'; }
      else if (delta < 0) { deltaText = '▼ ' + (-delta) + '%p'; deltaClass = 'down'; }
      else { deltaText = '–'; deltaClass = 'same'; }
      var catColor = (COLOR_HEX[r.cat.color] || COLOR_HEX.gray).text;

      return '<div class="compare-row">' +
        '<div class="compare-header">' +
          '<span class="name">' + emoji + escapeHtml(r.cat.name) + '</span>' +
          '<span class="delta ' + deltaClass + '">' + deltaText + '</span>' +
        '</div>' +
        '<div class="compare-bars">' +
          '<div class="bar-row">' +
            '<span class="bar-label">이번달</span>' +
            '<span class="bar"><span class="fill" style="width: ' + curPct + '%; background: ' + catColor + '"></span></span>' +
            '<span class="bar-pct">' + curPct + '%</span>' +
          '</div>' +
          '<div class="bar-row prev">' +
            '<span class="bar-label">지난달</span>' +
            '<span class="bar"><span class="fill" style="width: ' + prevPct + '%; background: var(--color-text-muted); opacity: 0.45"></span></span>' +
            '<span class="bar-pct">' + prevPct + '%</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    catCompareHost.innerHTML = '<div class="cat-compare">' + html + '</div>';
  }

  function renderWeekday() {
    var monthTxs = state.transactions.filter(function(t) {
      return monthKey(t.date) === viewMonth && isInBudgetScope(t);
    });
    var sums = [0,0,0,0,0,0,0];
    monthTxs.forEach(function(t) {
      sums[dayOfWeek(t.date)] += t.amount;
    });
    var maxSum = Math.max.apply(null, sums);

    if (maxSum === 0) {
      weekdayHost.innerHTML = '<div class="cat-summary-empty">이 달 거래가 없어요</div>';
      return;
    }

    var dayCounts = countDaysOfWeekInMonth(viewMonth);
    var weekendDays = dayCounts[0] + dayCounts[6];
    var weekdayDays = dayCounts[1] + dayCounts[2] + dayCounts[3] + dayCounts[4] + dayCounts[5];
    var weekendSum = sums[0] + sums[6];
    var weekdaySum = sums[1] + sums[2] + sums[3] + sums[4] + sums[5];
    var weekendAvg = weekendDays > 0 ? weekendSum / weekendDays : 0;
    var weekdayAvg = weekdayDays > 0 ? weekdaySum / weekdayDays : 0;

    var summaryText = '';
    if (weekendAvg > 0 && weekdayAvg > 0) {
      var ratio = weekendAvg / weekdayAvg;
      if (ratio > 1.15) summaryText = '주말이 평일보다 ' + ratio.toFixed(1) + '배 (일평균 기준)';
      else if (ratio < 0.85) summaryText = '평일이 주말보다 ' + (1 / ratio).toFixed(1) + '배 (일평균 기준)';
      else summaryText = '주말 · 평일 지출이 비슷해요';
    } else if (weekendAvg === 0 && weekdayAvg > 0) {
      summaryText = '주말 지출이 없어요';
    } else if (weekdayAvg === 0 && weekendAvg > 0) {
      summaryText = '평일 지출이 없어요';
    }

    var bars = sums.map(function(sum, i) {
      var heightPct = maxSum > 0 ? (sum / maxSum) * 100 : 0;
      var isWeekend = (i === 0 || i === 6);
      return '<div class="weekday-col' + (isWeekend ? ' weekend' : '') + '" title="' + DAY_NAMES[i] + ': ' + formatMoney(sum) + '">' +
        '<div class="bar" style="height: ' + heightPct.toFixed(1) + '%"></div>' +
        '<span class="day">' + DAY_NAMES[i] + '</span>' +
      '</div>';
    }).join('');

    weekdayHost.innerHTML =
      '<div class="weekday-card">' +
        '<div class="weekday-bars">' + bars + '</div>' +
        '<div class="weekday-summary">' + summaryText + '</div>' +
      '</div>';
  }

  function countDaysOfWeekInMonth(mk) {
    var p = mk.split('-');
    var y = parseInt(p[0], 10);
    var m = parseInt(p[1], 10) - 1;
    var dim = new Date(y, m + 1, 0).getDate();
    var counts = [0,0,0,0,0,0,0];
    for (var d = 1; d <= dim; d++) {
      counts[new Date(y, m, d).getDay()] += 1;
    }
    return counts;
  }

  function handleDeleteCategory(id) {
    var cat = getCategoryById(id);
    if (!cat) return;
    var children = getChildren(id);
    var txCount = state.transactions.filter(function(t) { return t.categoryId === id; }).length;
    var isEtc = cat.name === '기타';
    var etc = getEtcCategory();
    var moveToEtc = !isEtc && etc;

    var msg;
    if (children.length > 0) {
      msg = '"' + cat.name + '" 카테고리를 삭제할까요?\n하위 ' + children.length + '개도 함께 삭제됩니다.';
      if (txCount > 0 || children.some(function(ch) { return state.transactions.some(function(t) { return t.categoryId === ch.id; }); })) {
        var totalTx = state.transactions.filter(function(t) {
          return t.categoryId === id || children.some(function(ch) { return t.categoryId === ch.id; });
        }).length;
        msg += ' 거래 ' + totalTx + '개도 ' + (moveToEtc ? '"기타"로 이동' : '삭제') + '됩니다.';
      }
    } else if (moveToEtc) {
      msg = '"' + cat.name + '" 카테고리를 삭제할까요?\n거래 ' + txCount + '개는 "기타"로 이동됩니다.';
    } else {
      msg = '"' + cat.name + '" 카테고리를 삭제할까요?';
      if (txCount > 0) msg += '\n거래 ' + txCount + '개도 함께 삭제됩니다.';
    }
    if (!window.confirm(msg)) return;

    var idsToRemove = [id].concat(children.map(function(c) { return c.id; }));
    if (moveToEtc) {
      state.transactions.forEach(function(t) {
        if (idsToRemove.indexOf(t.categoryId) !== -1) t.categoryId = etc.id;
      });
    } else {
      state.transactions = state.transactions.filter(function(t) {
        return idsToRemove.indexOf(t.categoryId) === -1;
      });
    }
    state.categories = state.categories.filter(function(c) {
      return idsToRemove.indexOf(c.id) === -1;
    });
    // budgetCategoryId가 삭제됐으면 fallback
    if (idsToRemove.indexOf(state.meta.budgetCategoryId) !== -1) {
      var first = state.categories.filter(function(c) { return c.parentId === null; })[0];
      state.meta.budgetCategoryId = first ? first.id : null;
    }
    saveState();
    renderSettings();
  }

  function handleSettingsCatChange(id, field, newValue) {

    } else if (field === 'name') {
      var v = String(newValue || '').trim();
      if (v) cat.name = v;
    } else if (field === 'keywords') {
      var raw = String(newValue || '').trim();
      cat.keywords = raw ? raw.split(',').map(function(s) { return s.trim(); }).filter(Boolean) : [];
    } else if (field === 'budget') {
      var num = parseInt(String(newValue).replace(/[^\d-]/g, ''), 10);
      if (Number.isFinite(num) && num >= 0) cat.budget = num;
    } else if (field === 'parent') {
      var pid = newValue ? parseInt(newValue, 10) : null;
      if (pid !== cat.id) cat.parentId = pid;
    }
    saveState();

  // ===== Data export / import / reset =====
  function handleExport() {
    try {
      var payload = {
        version: SCHEMA_VERSION,
        exportedAt: new Date().toISOString(),
        categories: state.categories,
        transactions: state.transactions,
        meta: state.meta
      };
      var json = JSON.stringify(payload, null, 2);
      var blob = new Blob([json], { type: 'application/json;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      a.href = url;
      a.download = 'budget-' + stamp + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
      showToast('내보내기 완료');
    } catch (e) {
      showToast('내보내기 실패');
      console.warn('[export]', e);
    }
  }

  function handleImportFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function() {
      try {
        var parsed = JSON.parse(reader.result);
        var loaded = {
          categories: parsed.categories || [],
          transactions: parsed.transactions || [],
          meta: parsed.meta || {}
        };
        if (!Array.isArray(loaded.categories) || !Array.isArray(loaded.transactions)) {
          throw new Error('형식 오류');
        }
        if (!window.confirm('가져오기 시 현재 데이터는 덮어씌워집니다. 계속할까요?')) return;
        state = migrate(loaded);
        saveState();
        showToast('가져오기 완료');
        renderSettings();
        if (state.transactions.length) {
          var maxDate = state.transactions.reduce(function(acc, t) { return t.date > acc ? t.date : acc; }, state.transactions[0].date);
          viewMonth = monthKey(maxDate);
        } else {
          viewMonth = currentMonthKey();
        }
      } catch (e) {
        showToast('가져오기 실패: ' + (e.message || e));
        console.warn('[import]', e);
      }
    };
    reader.onerror = function() { showToast('파일 읽기 실패'); };
    reader.readAsText(file);
  }

  function handleReset() {
    if (!window.confirm('모든 데이터를 초기화할까요?\n카테고리·거래·예산 한도가 기본값으로 돌아갑니다.')) return;

  }
