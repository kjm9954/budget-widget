<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>가계부</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" />
  <style>
    :root {
      --color-text-primary: #37352f;
      --color-background-primary: #ffffff;
      --color-background-secondary: #f7f7f5;
      --color-border-tertiary: #e9e9e7;
      --border-radius-md: 6px;

      --color-text-muted: #787774;
      --color-warn-bg: #FCEBEB;
      --color-warn: #e03e3e;
      --color-caution: #dfab01;
      --color-progress-track: rgba(0, 0, 0, 0.08);

      --fs-base: 14px;
      --fs-sm: 12px;
      --fs-xs: 11px;
      --fs-h1: 18px;
      --fs-amount: 16px;
      --fs-hero: 26px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-text-primary: #e6e6e6;
        --color-background-primary: #191919;
        --color-background-secondary: #1f1f1f;
        --color-border-tertiary: #373737;
        --color-text-muted: #9b9a97;
        --color-warn-bg: #4a1f1f;
        --color-progress-track: rgba(255, 255, 255, 0.10);
      }
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      height: 100%;
    }
    body {
      padding: 12px 8px;
      font-family: 'Galmuri9', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      color: var(--color-text-primary);
      font-size: var(--fs-base);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .widget {
      max-width: 380px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      background: var(--color-background-primary);
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .screen {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      /* 스크롤바를 살짝 얇게 */
      scrollbar-width: thin;
    }
    .screen::-webkit-scrollbar { width: 6px; }
    .screen::-webkit-scrollbar-thumb {
      background: var(--color-border-tertiary);
      border-radius: 3px;
    }

    /* ===== Header ===== */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-shrink: 0;
    }
    .top-header h1 {
      margin: 0;
      font-size: var(--fs-h1);
      cursor: pointer;
      user-select: none;
      transition: opacity 0.15s;
    }
    .top-header h1:hover { opacity: 0.7; }
    .header-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .cloud-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      font-size: 14px;
      color: var(--color-text-muted);
      cursor: help;
      user-select: none;
    }
    .cloud-status[data-tone="ok"] { color: var(--color-text-primary); }
    .cloud-status[data-tone="pending"] { color: var(--color-caution); }
    .cloud-status[data-tone="err"] { color: var(--color-warn); }
    .icon-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--color-text-primary);
      cursor: pointer;
      border-radius: var(--border-radius-md);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover { background: var(--color-background-secondary); }
    .icon-btn.active {
      background: var(--color-text-primary);
      color: var(--color-background-primary);
    }
    .icon-btn.active:hover { opacity: 0.85; background: var(--color-text-primary); }

    /* ===== Sub header (stats/settings) ===== */
    .sub-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .sub-header h2 {
      margin: 0;
      font-size: var(--fs-h1);
      color: var(--color-text-primary);
      font-weight: bold;
    }

    /* ===== Month nav ===== */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      margin-bottom: 10px;
    }
    .month-nav button {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--color-text-primary);
      cursor: pointer;
      border-radius: var(--border-radius-md);
      font-size: 16px;
      font-family: inherit;
    }
    .month-nav button:hover:not(:disabled) {
      background: var(--color-border-tertiary);
    }
    .month-nav button:disabled {
      color: var(--color-text-muted);
      cursor: not-allowed;
      opacity: 0.35;
    }
    .month-nav .nav-label {
      font-weight: bold;
      font-size: var(--fs-base);
      flex: 1;
      text-align: center;
    }
    .month-nav .nav-label.not-current {
      color: var(--color-caution);
    }

    /* ===== Hero ===== */
    .hero {
      padding: 16px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      margin-bottom: 14px;
    }
    .hero-label {
      display: block;
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      margin-bottom: 4px;
    }
    .hero-amount {
      display: block;
      font-size: var(--fs-hero);
      font-weight: bold;
      line-height: 1.2;
      word-break: keep-all;
    }
    .hero-amount.over { color: var(--color-warn); }
    .hero-meta {
      display: block;
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      margin-top: 6px;
    }

    /* ===== Sections ===== */
    section { margin-bottom: 18px; }
    section:last-of-type { margin-bottom: 0; }

    h2.section-title {
      margin: 0 0 8px 0;
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      font-weight: normal;
      letter-spacing: 0.02em;
    }

    /* ===== Quick dates ===== */
    .quick-dates {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .quick-dates button {
      flex: 1;
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--fs-sm);
    }
    .quick-dates button:hover {
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
    }

    /* ===== Input ===== */
    .input-row {
      display: flex;
      gap: 6px;
    }
    .input-row input {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      font-family: inherit;
      font-size: var(--fs-base);
    }
    .input-row input:focus {
      outline: none;
      border-color: var(--color-text-muted);
    }
    .input-row button {
      min-height: 44px;
      min-width: 64px;
      padding: 0 14px;
      border: 1px solid var(--color-text-primary);
      border-radius: var(--border-radius-md);
      background: var(--color-text-primary);
      color: var(--color-background-primary);
      font-family: inherit;
      font-size: var(--fs-base);
      font-weight: bold;
      cursor: pointer;
    }
    .input-row button:hover { opacity: 0.85; }

    /* ===== Category mini bars (home) ===== */
    .cat-bars {
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .cat-bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-sm);
    }
    .cat-bar-row .name {
      width: 78px;
      flex-shrink: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cat-bar-row .bar {
      flex: 1;
      height: 8px;
      background: var(--color-progress-track);
      border-radius: 4px;
      overflow: hidden;
    }
    .cat-bar-row .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.2s;
    }
    .cat-bar-row .amount {
      width: 76px;
      text-align: right;
      flex-shrink: 0;
      font-weight: bold;
      color: var(--color-text-primary);
    }
    .cat-bars-empty {
      padding: 16px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      text-align: center;
      color: var(--color-text-muted);
      font-size: var(--fs-sm);
    }

    /* ===== Pace / forecast card (home) ===== */
    .pace-card {
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
    }
    .pace-row {
      display: flex;
      gap: 8px;
      font-size: var(--fs-sm);
      margin-bottom: 8px;
    }
    .pace-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .pace-col .pace-label {
      color: var(--color-text-muted);
      font-size: var(--fs-xs);
    }
    .pace-col .pace-value {
      font-weight: bold;
      font-size: var(--fs-base);
    }
    .pace-col.over .pace-value { color: var(--color-warn); }
    .pace-col.under .pace-value { color: #2ea043; }
    .pace-forecast {
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      padding-top: 8px;
      border-top: 1px solid var(--color-border-tertiary);
    }
    .pace-forecast.warn { color: var(--color-warn); }
    .pace-forecast.ok { color: #2ea043; }

    /* ===== Donut chart (stats) ===== */
    .cat-summary {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
    }
    .donut-wrap {
      position: relative;
      width: 110px;
      height: 110px;
      flex-shrink: 0;
    }
    .donut {
      width: 100%;
      height: 100%;
    }
    .donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .donut-center .pct {
      font-weight: bold;
      font-size: 20px;
      line-height: 1;
    }
    .donut-center .label {
      font-size: 10px;
      color: var(--color-text-muted);
      margin-top: 2px;
    }
    .cat-labels {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: var(--fs-sm);
      min-width: 0;
    }
    .cat-label {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .cat-label .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .cat-label .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cat-label .pct {
      font-weight: bold;
      color: var(--color-text-primary);
      flex-shrink: 0;
    }
    .cat-summary-empty {
      padding: 20px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      text-align: center;
      color: var(--color-text-muted);
      font-size: var(--fs-sm);
    }

    /* ===== Weekday bars (stats) ===== */
    .weekday-card {
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
    }
    .weekday-bars {
      display: flex;
      gap: 4px;
      align-items: flex-end;
      height: 60px;
      margin-bottom: 8px;
    }
    .weekday-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      height: 100%;
    }
    .weekday-col .bar {
      width: 80%;
      background: var(--color-text-primary);
      border-radius: 3px 3px 0 0;
      min-height: 2px;
      transition: height 0.2s;
    }
    .weekday-col.weekend .bar {
      background: var(--color-warn);
      opacity: 0.6;
    }
    .weekday-col .day {
      font-size: var(--fs-xs);
      color: var(--color-text-muted);
    }
    .weekday-col.weekend .day {
      color: var(--color-warn);
    }
    .weekday-summary {
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      text-align: center;
      padding-top: 8px;
      border-top: 1px solid var(--color-border-tertiary);
    }

    /* ===== Weeks ===== */
    .week {
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      margin-bottom: 8px;
      cursor: pointer;
    }
    .week.over { background: var(--color-warn-bg); }
    .week-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-sm);
    }
    .week-row .label {
      color: var(--color-text-muted);
      flex: 1;
    }
    .week-row .amount {
      font-weight: bold;
      font-size: var(--fs-base);
    }
    .week-row .chevron {
      color: var(--color-text-muted);
      transition: transform 0.2s;
      font-size: 12px;
      width: 14px;
      text-align: right;
    }
    .week.collapsed .chevron { transform: rotate(-90deg); }
    .week-detail { margin-top: 10px; }
    .week.collapsed .week-detail { display: none; }

    .progress {
      height: 6px;
      background: var(--color-progress-track);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      transition: width 0.2s;
      border-radius: 3px;
    }

    /* ===== Categories (stats view) ===== */
    .category-view {
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      margin-bottom: 8px;
    }
    .cv-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
    }
    .cv-emoji {
      font-size: 16px;
      line-height: 1;
      flex-shrink: 0;
    }
    .cv-name {
      font-weight: bold;
      flex: 1;
      font-size: var(--fs-base);
    }
    .cv-amount {
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
    }
    .cv-amount .spent {
      color: var(--color-text-primary);
      font-weight: bold;
      font-size: var(--fs-base);
    }

    /* ===== Transactions ===== */
    .tx-group { margin-bottom: 14px; }
    .tx-group:last-child { margin-bottom: 0; }
    .tx-group-header {
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      margin-bottom: 6px;
      padding-left: 4px;
    }
    .tx {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      margin-bottom: 6px;
    }
    .tx-body {
      flex: 1;
      min-width: 0;
    }
    .tx-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .tx-amount {
      font-weight: bold;
      font-size: var(--fs-amount);
    }
    .tx-raw {
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      word-break: break-all;
    }
    .tx-delete {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      border-radius: var(--border-radius-md);
      font-size: 18px;
      flex-shrink: 0;
    }
    .tx-delete:hover {
      background: var(--color-border-tertiary);
      color: var(--color-warn);
    }

    /* ===== Empty state ===== */
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 8px;
      line-height: 1;
    }
    .empty-message {
      color: var(--color-text-muted);
      font-size: var(--fs-sm);
    }

    /* ===== Badge ===== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: var(--fs-xs);
      font-weight: normal;
      flex-shrink: 0;
    }

    /* ===== Settings screen ===== */
    .screen[hidden] { display: none; }

    .settings-section { margin-bottom: 22px; }
    .settings-section:last-child { margin-bottom: 0; }
    .settings-section h3 {
      margin: 0 0 8px 0;
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
      font-weight: normal;
      letter-spacing: 0.02em;
    }

    .limit-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      margin-bottom: 6px;
      font-size: var(--fs-base);
    }
    .limit-row .label {
      flex: 1;
      color: var(--color-text-muted);
    }
    .limit-row input {
      width: 120px;
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      font-family: inherit;
      font-size: var(--fs-base);
      text-align: right;
    }
    .limit-row input:focus { outline: none; border-color: var(--color-text-muted); }

    .settings-cat {
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      margin-bottom: 8px;
    }
    .settings-cat-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .settings-cat input {
      font-family: inherit;
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
    }
    .settings-cat input:focus { outline: none; border-color: var(--color-text-muted); }
    .settings-cat .emoji-input {
      width: 48px;
      min-height: 36px;
      padding: 0;
      text-align: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .settings-cat .name-input {
      flex: 1;
      min-width: 0;
      min-height: 36px;
      padding: 0 10px;
      font-size: var(--fs-base);
      font-weight: bold;
    }
    .settings-cat .kw-input {
      width: 100%;
      min-height: 36px;
      padding: 0 10px;
      font-size: var(--fs-sm);
      margin-bottom: 8px;
    }
    .settings-cat .budget-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-sm);
      color: var(--color-text-muted);
    }
    .settings-cat .budget-row input {
      width: 130px;
      min-height: 36px;
      padding: 0 10px;
      font-size: var(--fs-base);
      text-align: right;
    }
    .settings-cat-delete {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      border-radius: var(--border-radius-md);
      font-size: 18px;
      flex-shrink: 0;
    }
    .settings-cat-delete:hover {
      background: var(--color-border-tertiary);
      color: var(--color-warn);
    }

    .add-cat-trigger {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border: 1px dashed var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--fs-base);
      margin-top: 4px;
    }
    .add-cat-trigger:hover {
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
    }

    .add-cat-panel {
      margin-top: 8px;
      padding: 12px 14px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .add-cat-panel .row1 {
      display: flex;
      gap: 8px;
    }
    .add-cat-panel input {
      font-family: inherit;
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      border: 1px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
    }
    .add-cat-panel input:focus { outline: none; border-color: var(--color-text-muted); }
    .add-cat-panel .emoji {
      width: 56px;
      min-height: 44px;
      padding: 0;
      text-align: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .add-cat-panel .name {
      flex: 1;
      min-width: 0;

    /* ===== Toast ===== */

      max-width: 90%;
      text-align: center;
      z-index: 10;
      white-space: nowrap;
    }
    .toast.visible { opacity: 0.95; }
  </style>
</head>
<body>

      <div class="add-cat-panel" hidden>

        <input type="file" class="import-input" accept="application/json,.json" />
        <p class="data-hint">내보낸 JSON 파일은 다른 디바이스나 백업용으로 활용하세요. 가져오기 시 현재 데이터는 덮어씌워집니다.</p>
      </div>

  <div class="toast"></div>
</main>

<script>
(function () {
  'use strict';

  // ===== Cloud sync constants =====
  var WORKER_URL = 'REPLACE-ME';
  var SAVE_DEBOUNCE_MS = 1500;

  // ===== Constants =====
  var KEYS = {
    CATEGORIES: 'budget_widget_v1_categories',
    TRANSACTIONS: 'budget_widget_v1_transactions',
    META: 'budget_widget_v1_meta'
  };
  var DEFAULT_MONTH_LIMIT = 1000000;
  var DEFAULT_WEEK_LIMIT = 250000;

  var CATEGORY_COLORS = ['brown', 'orange', 'yellow', 'green', 'blue', 'purple', 'pink'];
  var COLOR_HEX = {
    gray:   { rgb: '155,154,151', text: '#9b9a97' },
    brown:  { rgb: '100,71,58',   text: '#a16f4d' },
    orange: { rgb: '217,115,13',  text: '#d9730d' },
    yellow: { rgb: '223,171,1',   text: '#dfab01' },
    green:  { rgb: '15,123,108',  text: '#2ea043' },
    blue:   { rgb: '11,110,153',  text: '#2383e2' },
    purple: { rgb: '105,64,165',  text: '#9065c2' },
    pink:   { rgb: '173,26,114',  text: '#c44ba0' },
    red:    { rgb: '224,62,62',   text: '#e03e3e' }
  };

  var DATE_KEYWORDS = [
    { word: '그저께', offset: -2 },
    { word: '그제',   offset: -2 },
    { word: '어제',   offset: -1 },
    { word: '오늘',   offset:  0 }
  ];

  var DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];

  // ===== State =====
  var state = {
    categories: [],
    transactions: [],
    meta: { nextTxId: 1, nextCatId: 1, monthLimit: DEFAULT_MONTH_LIMIT, weekLimit: DEFAULT_WEEK_LIMIT }
  };

  var viewMonth = null;

  // ===== Cloud sync state =====
  var cloudPageId = null;
  var cloudKey = null;
  var cloudEnabled = false;
  var cloudSaveTimer = null;
  var cloudInFlight = false;
  var cloudPendingSave = false;
  var cloudApplyingRemote = false;

  function defaultState() {
    return {
      categories: [
        { id: 1, name: '카페', emoji: '☕', keywords: ['카페','커피','아메리카노','라떼','스타벅스'], budget: 100000, color: 'brown' },
        { id: 2, name: '식비', emoji: '🍚', keywords: ['식비','점심','저녁','아침','식당','김밥','분식','배달'], budget: 400000, color: 'orange' },
        { id: 3, name: '교통', emoji: '🚇', keywords: ['교통','택시','지하철','버스','주유'], budget: 100000, color: 'yellow' },
        { id: 4, name: '쇼핑', emoji: '🛍', keywords: ['쇼핑','옷','쿠팡','온라인','배송'], budget: 200000, color: 'green' },
        { id: 5, name: '기타', emoji: '', keywords: [], budget: 200000, color: 'gray' }
      ],
      transactions: [],
      meta: { nextTxId: 1, nextCatId: 6, monthLimit: DEFAULT_MONTH_LIMIT, weekLimit: DEFAULT_WEEK_LIMIT }
    };
  }

  function migrate(loaded) {
    loaded.categories = (loaded.categories || []).map(function(c) {
      if (!('emoji' in c)) c.emoji = '';
      return c;
    });
    loaded.transactions = loaded.transactions || [];
    loaded.meta = loaded.meta || {};
    if (typeof loaded.meta.monthLimit !== 'number') loaded.meta.monthLimit = DEFAULT_MONTH_LIMIT;
    if (typeof loaded.meta.weekLimit !== 'number') loaded.meta.weekLimit = DEFAULT_WEEK_LIMIT;
    if (typeof loaded.meta.nextTxId !== 'number') loaded.meta.nextTxId = 1;
    if (typeof loaded.meta.nextCatId !== 'number') loaded.meta.nextCatId = 1;
    return loaded;
  }

  function loadStateLocal() {
    try {
      var cats = localStorage.getItem(KEYS.CATEGORIES);
      var txs  = localStorage.getItem(KEYS.TRANSACTIONS);
      var meta = localStorage.getItem(KEYS.META);
      if (cats && txs && meta) {
        return migrate({
          categories: JSON.parse(cats),
          transactions: JSON.parse(txs),
          meta: JSON.parse(meta)
        });
      }
    } catch (err) {
      console.warn('가계부 데이터 로드 실패, 기본값 사용', err);
    }
    return defaultState();
  }

  function saveStateLocal() {
    try {
      localStorage.setItem(KEYS.CATEGORIES, JSON.stringify(state.categories));
      localStorage.setItem(KEYS.TRANSACTIONS, JSON.stringify(state.transactions));
      localStorage.setItem(KEYS.META, JSON.stringify(state.meta));
    } catch (err) {
      console.warn('가계부 데이터 저장 실패 (인메모리 유지)', err);
    }
  }

  function saveState() {
    saveStateLocal();
    if (cloudEnabled && !cloudApplyingRemote) {
      cloudScheduleSave();
    }
  }

  // ===== Cloud sync functions =====
  function cloudReadParams() {
    try {
      var sp = new URLSearchParams(location.search);
      var hashRaw = (location.hash || '').replace(/^#/, '');
      var hp = new URLSearchParams(hashRaw);
      cloudPageId = sp.get('np') || sp.get('page') || hp.get('np') || hp.get('page') || null;
      cloudKey = sp.get('nk') || hp.get('nk') || null;
      var workerOk = typeof WORKER_URL === 'string' && WORKER_URL && WORKER_URL.indexOf('REPLACE-ME') === -1;
      cloudEnabled = !!(cloudPageId && workerOk);
    } catch (e) { cloudEnabled = false; }
  }

  function cloudHeaders() {
    var h = { 'Content-Type': 'application/json' };
    if (cloudKey) h['X-Widget-Key'] = cloudKey;
    return h;
  }

  function cloudUrl() {
    return WORKER_URL.replace(/\/+$/, '') + '/?p=' + encodeURIComponent(cloudPageId);
  }

  function setCloudStatus(icon, tone, title) {
    var el = widget && widget.querySelector('.cloud-status');
    if (!el) return;
    el.textContent = icon;
    el.dataset.tone = tone || '';
    if (title) el.title = title;
  }

  function cloudLoad() {
    if (!cloudEnabled) return Promise.resolve(null);
    setCloudStatus('⟳', 'pending', '동기화 중…');
    return fetch(cloudUrl(), { method: 'GET', headers: cloudHeaders() })
      .then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function(data) {
        setCloudStatus('☁', 'ok', '동기화됨 · ' + new Date().toLocaleTimeString('ko-KR'));
        return (data && data.state) || null;
      })
      .catch(function(e) {
        setCloudStatus('!', 'err', '동기화 실패: ' + (e && e.message || e));
        console.warn('[cloud] load failed:', e);
        return null;
      });
  }

  function cloudSaveNow() {
    if (!cloudEnabled) return Promise.resolve();
    if (cloudInFlight) { cloudPendingSave = true; return Promise.resolve(); }
    cloudInFlight = true;
    setCloudStatus('⟳', 'pending', '저장 중…');
    return fetch(cloudUrl(), { method: 'PUT', headers: cloudHeaders(), body: JSON.stringify(state) })
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        setCloudStatus('☁', 'ok', '동기화됨 · ' + new Date().toLocaleTimeString('ko-KR'));
      })
      .catch(function(e) {
        setCloudStatus('!', 'err', '저장 실패: ' + (e && e.message || e));
        console.warn('[cloud] save failed:', e);
      })
      .then(function() {
        cloudInFlight = false;
        if (cloudPendingSave) { cloudPendingSave = false; cloudScheduleSave(); }
      });
  }

  function cloudScheduleSave() {
    if (!cloudEnabled) return;
    if (cloudApplyingRemote) return;
    if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
    cloudSaveTimer = setTimeout(cloudSaveNow, SAVE_DEBOUNCE_MS);
  }

  function initCloudSync(onRemoteApplied) {
    cloudReadParams();
    if (!cloudEnabled) {
      var reason = !cloudPageId ? '로컬 저장만 (URL에 ?np=... 없음)' : '로컬 저장만 (Worker URL 미설정)';
      setCloudStatus('⌂', '', reason);
      return Promise.resolve(false);
    }
    cloudApplyingRemote = true;
    return cloudLoad().then(function(remote) {
      cloudApplyingRemote = false;
      if (remote) { if (typeof onRemoteApplied === 'function') onRemoteApplied(remote); }
      else { cloudScheduleSave(); }
      return true;
    }).catch(function() { cloudApplyingRemote = false; return false; });
  }

  // ===== Utilities =====
  function formatMoney(n) { return Math.round(n).toLocaleString('ko-KR') + '원'; }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function todayStr() { return ymd(new Date()); }
  function offsetDate(offset) { var d = new Date(); d.setDate(d.getDate() + offset); return ymd(d); }
  function monthKey(dateStr) { return dateStr.slice(0, 7); }
  function getWeekIndex(dateStr) {
    var day = parseInt(dateStr.slice(8, 10), 10);
    return Math.min(3, Math.floor((day - 1) / 7));
  }
  function currentMonthKey() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
  function shiftMonth(mk, delta) {
    var p = mk.split('-');
    var y = parseInt(p[0], 10);
    var m = parseInt(p[1], 10) - 1 + delta;
    var d = new Date(y, m, 1);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
  }
  function formatMonthLabel(mk) {
    var p = mk.split('-');
    return p[0] + '년 ' + parseInt(p[1], 10) + '월';
  }
  function formatTxDate(dateStr) {
    if (dateStr === todayStr()) return '오늘';
    if (dateStr === offsetDate(-1)) return '어제';
    if (dateStr === offsetDate(-2)) return '그저께';
    var p = dateStr.split('-');
    return parseInt(p[1], 10) + '월 ' + parseInt(p[2], 10) + '일';
  }
  function daysInMonth(mk) {
    var p = mk.split('-');
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10), 0).getDate();
  }
  function dayOfWeek(dateStr) {
    var p = dateStr.split('-');
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)).getDay();
  }
  function getCategoryById(id) {
    for (var i = 0; i < state.categories.length; i++) {
      if (state.categories[i].id === id) return state.categories[i];
    }
    return null;
  }
  function getEtcCategory() {
    for (var i = 0; i < state.categories.length; i++) {
      if (state.categories[i].name === '기타') return state.categories[i];
    }
    return null;
  }
  function progressColor(ratio, baseHex) {
    if (ratio >= 1) return COLOR_HEX.red.text;
    if (ratio >= 0.8) return COLOR_HEX.yellow.text;
    return baseHex;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[ch];
    });
  }
  function badgeHtml(category) {
    var c = COLOR_HEX[category.color] || COLOR_HEX.gray;
    var emoji = category.emoji ? escapeHtml(category.emoji) + ' ' : '';
    return '<span class="badge" style="background-color: rgba(' + c.rgb + ', 0.25); color: ' + c.text + '">' + emoji + escapeHtml(category.name) + '</span>';
  }
  function autoCommaText(text) {
    return text.replace(/\d{1,3}(?:,\d{3})+|\d{4,}/g, function(m) {
      var n = parseInt(m.replace(/,/g, ''), 10);
      if (!Number.isFinite(n)) return m;
      return n.toLocaleString('ko-KR');
    });
  }

  // ===== Parsers =====
  function parseDate(text) {
    for (var i = 0; i < DATE_KEYWORDS.length; i++) {
      var k = DATE_KEYWORDS[i];
      var idx = text.indexOf(k.word);
      if (idx !== -1) {
        return { date: offsetDate(k.offset), remainText: text.slice(0, idx) + text.slice(idx + k.word.length) };
      }
    }
    return { date: todayStr(), remainText: text };
  }
  function parseAmount(text) {
    var re = /\d{1,3}(?:,\d{3})+|\d{3,}/;
    var m = text.match(re);
    if (!m) return { amount: null, remainText: text };
    var amount = parseInt(m[0].replace(/,/g, ''), 10);
    if (!Number.isFinite(amount) || amount <= 0) return { amount: null, remainText: text };
    return { amount: amount, remainText: text.slice(0, m.index) + text.slice(m.index + m[0].length) };
  }
  function matchCategory(text, categories) {
    for (var i = 0; i < categories.length; i++) {
      var c = categories[i];
      if (c.keywords && c.keywords.length) {
        for (var j = 0; j < c.keywords.length; j++) {
          var k = c.keywords[j];
          if (k && text.indexOf(k) !== -1) return c.id;
        }
      }
    }
    var etc = null;
    for (var n = 0; n < categories.length; n++) {
      if (categories[n].name === '기타') { etc = categories[n]; break; }
    }
    if (etc) return etc.id;
    return categories.length > 0 ? categories[0].id : null;
  }
  function parseEntry(rawText) {
    var trimmed = (rawText || '').trim();
    if (!trimmed) return null;
    var dateRes = parseDate(trimmed);
    var amountRes = parseAmount(dateRes.remainText);
    if (amountRes.amount === null) return null;
    var categoryId = matchCategory(amountRes.remainText, state.categories);
    if (categoryId === null) return null;
    return { amount: amountRes.amount, date: dateRes.date, categoryId: categoryId, rawText: trimmed };
  }

  // ===== DOM refs =====
  var widget = document.querySelector('.widget');
  var screenHome = widget.querySelector('.screen-home');
  var screenStats = widget.querySelector('.screen-stats');
  var screenSettings = widget.querySelector('.screen-settings');

  var titleEl = widget.querySelector('.top-header h1');
  var statsBtn = widget.querySelector('.stats-btn');
  var settingsBtn = widget.querySelector('.settings-btn');
  var backBtnStats = widget.querySelector('.back-btn-stats');
  var backBtnSettings = widget.querySelector('.back-btn-settings');

  // Home
  var homeHeroAmount = screenHome.querySelector('.hero-amount');
  var homeHeroMeta = screenHome.querySelector('.hero-meta');
  var homeHeroLabel = screenHome.querySelector('.hero-label');
  var entryInput = screenHome.querySelector('#entry');
  var addBtn = screenHome.querySelector('#add-btn');
  var quickDatesEl = screenHome.querySelector('.quick-dates');
  var catBarsHost = screenHome.querySelector('.cat-bars-host');

  // ===== Donut chart (stats) =====
  function renderDonut(items, totalSpent, centerPct) {
    var R = 40;
    var circumference = 2 * Math.PI * R;
    var html = '<svg viewBox="0 0 100 100" class="donut">';
    html += '<circle cx="50" cy="50" r="' + R + '" fill="none" stroke="var(--color-progress-track)" stroke-width="14"/>';
    if (items && items.length > 0 && totalSpent > 0) {
      var offsetSum = 0;
      items.forEach(function(item) {
        if (item.amount <= 0) return;
        var pct = item.amount / totalSpent;
        var len = pct * circumference;
        var offsetLen = offsetSum * circumference;
        var color = (COLOR_HEX[item.color] || COLOR_HEX.gray).text;
        html += '<circle cx="50" cy="50" r="' + R + '" fill="none" stroke="' + color +
                '" stroke-width="14" stroke-dasharray="' + len.toFixed(2) + ' ' + circumference.toFixed(2) +
                '" stroke-dashoffset="' + (-offsetLen).toFixed(2) +
                '" transform="rotate(-90 50 50)" />';
        offsetSum += pct;
      });
    }
    html += '</svg>';
    html += '<div class="donut-center"><span class="pct">' + centerPct + '%</span><span class="label">월 사용</span></div>';
    return html;
  }

  function renderPaceCard() {
    var month = currentMonthKey();
    var monthTxs = state.transactions.filter(function(t) { return monthKey(t.date) === month; });
    var spent = monthTxs.reduce(function(s,t) { return s + t.amount; }, 0);
    var limit = state.meta.monthLimit;

    var today = new Date();
    var dim = daysInMonth(month);
    var elapsed = today.getDate(); // 1~31
    var remainingDays = Math.max(0, dim - elapsed);

    var actualAvg = elapsed > 0 ? spent / elapsed : 0;
    var recommendedAvg = dim > 0 ? limit / dim : 0;

    var actualClass = '';
    if (actualAvg > recommendedAvg * 1.05) actualClass = 'over';
    else if (actualAvg < recommendedAvg * 0.95) actualClass = 'under';

    // 추세 예측
    var forecastHtml = '';
    if (spent <= 0) {
      forecastHtml = '<div class="pace-forecast">아직 지출이 없어 추세를 못 잡아요</div>';
    } else if (spent >= limit) {
      forecastHtml = '<div class="pace-forecast warn">이미 한도를 ' + formatMoney(spent - limit) + ' 넘었어요</div>';
    } else {
      var remainingBudget = limit - spent;
      var daysToLimit = actualAvg > 0 ? Math.ceil(remainingBudget / actualAvg) : Infinity;
      if (daysToLimit > remainingDays || !Number.isFinite(daysToLimit)) {
        var predictedTotal = actualAvg * dim;
        var predictedRemaining = limit - predictedTotal;
        forecastHtml = '<div class="pace-forecast ok">이 추세대로면 월말까지 ' +
          formatMoney(Math.max(0, predictedRemaining)) + ' 남아요</div>';
      } else {
        var reachDay = elapsed + daysToLimit;
        if (reachDay > dim) reachDay = dim;
        forecastHtml = '<div class="pace-forecast warn">이 추세대로면 ' +
          parseInt(month.split('-')[1], 10) + '월 ' + reachDay + '일에 한도 도달</div>';
      }
    }

    var html =
      '<div class="pace-card">' +
        '<div class="pace-row">' +
          '<div class="pace-col ' + actualClass + '">' +
            '<span class="pace-label">실제 평균</span>' +
            '<span class="pace-value">' + formatMoney(actualAvg) + '/일</span>' +
          '</div>' +
          '<div class="pace-col">' +
            '<span class="pace-label">권장 평균</span>' +
            '<span class="pace-value">' + formatMoney(recommendedAvg) + '/일</span>' +
          '</div>' +
        '</div>' +
        forecastHtml +
      '</div>';

    paceHost.innerHTML = html;
  }

  function renderWeekday() {
    var monthTxs = state.transactions.filter(function(t) { return monthKey(t.date) === viewMonth; });
    var sums = [0,0,0,0,0,0,0];   // 일~토 합계
    var counts = [0,0,0,0,0,0,0]; // 거래 건수 (참고용)
    monthTxs.forEach(function(t) {
      var d = dayOfWeek(t.date);
      sums[d] += t.amount;
      counts[d] += 1;
    });
    var maxSum = Math.max.apply(null, sums);

    if (maxSum === 0) {
      weekdayHost.innerHTML = '<div class="cat-summary-empty">이 달 거래가 없어요</div>';
      return;
    }

    var weekendSum = sums[0] + sums[6];
    var weekdaySum = sums[1] + sums[2] + sums[3] + sums[4] + sums[5];
    // 평균: 같은 요일 등장 횟수만큼 나눠야 정확. 간단화: 단순 합 비교 + 일수 고려
    // 한 달에 주말 약 8~10일, 평일 약 20~22일 가정. 일평균으로 환산.
    // 실제 등장한 요일의 day count 카운트
    var dayCounts = countDaysOfWeekInMonth(viewMonth);
    var weekendDays = dayCounts[0] + dayCounts[6];
    var weekdayDays = dayCounts[1] + dayCounts[2] + dayCounts[3] + dayCounts[4] + dayCounts[5];
    var weekendAvg = weekendDays > 0 ? weekendSum / weekendDays : 0;
    var weekdayAvg = weekdayDays > 0 ? weekdaySum / weekdayDays : 0;

    var summaryText = '';
    if (weekendAvg > 0 && weekdayAvg > 0) {
      var ratio = weekendAvg / weekdayAvg;
      if (ratio > 1.15) {
        summaryText = '주말이 평일보다 ' + ratio.toFixed(1) + '배 (일평균 기준)';
      } else if (ratio < 0.85) {
        summaryText = '평일이 주말보다 ' + (1 / ratio).toFixed(1) + '배 (일평균 기준)';
      } else {
        summaryText = '주말 · 평일 지출이 비슷해요';
      }
    } else if (weekendAvg === 0 && weekdayAvg > 0) {
      summaryText = '주말 지출이 없어요';
    } else if (weekdayAvg === 0 && weekendAvg > 0) {
      summaryText = '평일 지출이 없어요';
    }

    var bars = sums.map(function(sum, i) {
      var heightPct = maxSum > 0 ? (sum / maxSum) * 100 : 0;
      var isWeekend = (i === 0 || i === 6);
      return '<div class="weekday-col' + (isWeekend ? ' weekend' : '') + '" title="' + DAY_NAMES[i] + ': ' + formatMoney(sum) + '">' +
        '<div class="bar" style="height: ' + heightPct.toFixed(1) + '%"></div>' +
        '<span class="day">' + DAY_NAMES[i] + '</span>' +
      '</div>';
    }).join('');

    weekdayHost.innerHTML =
      '<div class="weekday-card">' +
        '<div class="weekday-bars">' + bars + '</div>' +
        '<div class="weekday-summary">' + summaryText + '</div>' +
      '</div>';
  }

  function countDaysOfWeekInMonth(mk) {
    var p = mk.split('-');
    var y = parseInt(p[0], 10);
    var m = parseInt(p[1], 10) - 1;
    var dim = new Date(y, m + 1, 0).getDate();
    var counts = [0,0,0,0,0,0,0];
    for (var d = 1; d <= dim; d++) {
      counts[new Date(y, m, d).getDay()] += 1;
    }
    return counts;
  }

  // ===== Quick dates =====
  function applyQuickDate(keyword) {
    var v = entryInput.value;
    v = v.replace(/(그저께|그제|어제|오늘)\s*/g, '').trim();
    entryInput.value = (keyword + (v ? ' ' + v : ' ')).replace(/\s+/g, ' ');
    entryInput.focus();
    var end = entryInput.value.length;
    try { entryInput.setSelectionRange(end, end); } catch(e) {}
  }

  // ===== Auto comma =====
  function handleEntryInput() {
    var v = entryInput.value;
    var caret = entryInput.selectionStart;
    var nv = autoCommaText(v);
    if (nv === v) return;
    var leftBefore = v.slice(0, caret);
    var leftAfter = autoCommaText(leftBefore);
    var newCaret = leftAfter.length;
    entryInput.value = nv;
    try { entryInput.setSelectionRange(newCaret, newCaret); } catch(e) {}
  }

  // ===== Action handlers =====
  function handleAdd() {
    var text = entryInput.value;
    var entry = parseEntry(text);
    if (!entry) { showToast('금액을 못 찾았어요'); return; }
    state.transactions.push({
      id: state.meta.nextTxId,
      amount: entry.amount,
      date: entry.date,
      categoryId: entry.categoryId,
      rawText: entry.rawText
    });
    state.meta.nextTxId += 1;
    saveState();
    entryInput.value = '';
    renderHome();
  }

  function handleDeleteTx(id) {
    state.transactions = state.transactions.filter(function(t) { return t.id !== id; });
    saveState();
    if (!screenHome.hidden) renderHome();
    if (!screenStats.hidden) renderStats();
  }

  function handleDeleteCategory(id) {
    var cat = getCategoryById(id);
    if (!cat) return;
    var txCount = state.transactions.filter(function(t) { return t.categoryId === id; }).length;
    var isEtc = cat.name === '기타';
    var etc = getEtcCategory();
    var moveToEtc = !isEtc && etc;

    var msg;
    if (moveToEtc) {
      msg = '"' + cat.name + '" 카테고리를 삭제할까요?\n거래 ' + txCount + '개는 "기타"로 이동됩니다.';
    } else {
      msg = '"' + cat.name + '" 카테고리를 삭제할까요?';
      if (txCount > 0) msg += '\n거래 ' + txCount + '개도 함께 삭제됩니다.';
    }
    if (!window.confirm(msg)) return;

    if (moveToEtc) {
      state.transactions.forEach(function(t) { if (t.categoryId === id) t.categoryId = etc.id; });
    } else {
      state.transactions = state.transactions.filter(function(t) { return t.categoryId !== id; });
    }
    state.categories = state.categories.filter(function(c) { return c.id !== id; });
    saveState();
    renderSettings();
  }

  function pickNextColor() {
    var used = {};
    state.categories.forEach(function(c) { used[c.color] = true; });
    for (var i = 0; i < CATEGORY_COLORS.length; i++) {
      if (!used[CATEGORY_COLORS[i]]) return CATEGORY_COLORS[i];
    }
    return CATEGORY_COLORS[state.categories.length % CATEGORY_COLORS.length];
  }

  function clearAddCatPanel() {
    addCatPanel.querySelector('input.emoji').value = '';
    addCatPanel.querySelector('input.name').value = '';
    addCatPanel.querySelector('input.kw').value = '';
    addCatPanel.querySelector('input.budget').value = '';
    addCatPanel.hidden = true;
    addCatTrigger.hidden = false;
  }

  function handleAddCategoryConfirm() {
    var emoji = addCatPanel.querySelector('input.emoji').value.trim();
    var name = addCatPanel.querySelector('input.name').value.trim();
    var kwRaw = addCatPanel.querySelector('input.kw').value.trim();
    var budgetRaw = addCatPanel.querySelector('input.budget').value.trim();

    if (!name) { showToast('이름을 입력해주세요'); return; }
    var budget = parseInt(budgetRaw, 10);
    if (!Number.isFinite(budget) || budget < 0) { showToast('예산은 0 이상의 숫자여야 해요'); return; }
    var keywords = kwRaw ? kwRaw.split(',').map(function(s) { return s.trim(); }).filter(Boolean) : [];

    state.categories.push({
      id: state.meta.nextCatId, name: name, emoji: emoji,
      keywords: keywords, budget: budget, color: pickNextColor()
    });
    state.meta.nextCatId += 1;
    saveState();
    clearAddCatPanel();
    renderSettings();
  }

  function handleSettingsCatChange(id, field, newValue) {
    var cat = getCategoryById(id);
    if (!cat) return;
    if (field === 'emoji') {
      cat.emoji = String(newValue || '').trim().slice(0, 8);
    } else if (field === 'name') {
      var v = String(newValue || '').trim();
      if (v) cat.name = v;
    } else if (field === 'keywords') {
      var raw = String(newValue || '').trim();
      cat.keywords = raw ? raw.split(',').map(function(s) { return s.trim(); }).filter(Boolean) : [];
    } else if (field === 'budget') {
      var num = parseInt(String(newValue).replace(/[^\d-]/g, ''), 10);
      if (Number.isFinite(num) && num >= 0) cat.budget = num;
    }
    saveState();
  }

  function handleLimitChange(field, newValue) {
    var num = parseInt(String(newValue).replace(/[^\d-]/g, ''), 10);
    if (!Number.isFinite(num) || num < 0) {
      showToast('한도는 0 이상의 숫자여야 해요');
      if (field === 'monthLimit') monthLimitInput.value = state.meta.monthLimit;
      else if (field === 'weekLimit') weekLimitInput.value = state.meta.weekLimit;
      return;
    }
    state.meta[field] = num;
    saveState();
  }

  // ===== Data export / import / reset =====
  function handleExport() {
    try {
      var payload = {
        version: 1,
        exportedAt: new Date().toISOString(),
        categories: state.categories,
        transactions: state.transactions,
        meta: state.meta
      };
      var json = JSON.stringify(payload, null, 2);
      var blob = new Blob([json], { type: 'application/json;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      a.href = url;
      a.download = 'budget-' + stamp + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
      showToast('내보내기 완료');
    } catch (e) {
      showToast('내보내기 실패');
      console.warn('[export]', e);
    }
  }

  function handleImportFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function() {
      try {
        var parsed = JSON.parse(reader.result);
        var loaded = {
          categories: parsed.categories || [],
          transactions: parsed.transactions || [],
          meta: parsed.meta || {}
        };
        if (!Array.isArray(loaded.categories) || !Array.isArray(loaded.transactions)) {
          throw new Error('형식 오류');
        }
        if (!window.confirm('가져오기 시 현재 데이터는 덮어씌워집니다. 계속할까요?')) return;
        state = migrate(loaded);
        saveState();
        showToast('가져오기 완료');
        renderSettings();
        if (state.transactions.length) {
          var maxDate = state.transactions.reduce(function(acc, t) { return t.date > acc ? t.date : acc; }, state.transactions[0].date);
          viewMonth = monthKey(maxDate);
        } else {
          viewMonth = currentMonthKey();
        }
      } catch (e) {
        showToast('가져오기 실패: ' + (e.message || e));
        console.warn('[import]', e);
      }
    };
    reader.onerror = function() { showToast('파일 읽기 실패'); };
    reader.readAsText(file);
  }

  function handleReset() {
    if (!window.confirm('모든 데이터를 초기화할까요?\n카테고리·거래·예산 한도가 기본값으로 돌아갑니다.')) return;
    state = defaultState();
    viewMonth = currentMonthKey();
    saveState();
    showToast('초기화 완료');
    renderSettings();
  }

  // ===== Event bindings =====
  addBtn.addEventListener('click', handleAdd);
  entryInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); handleAdd(); }
  });
  entryInput.addEventListener('input', handleEntryInput);

  quickDatesEl.addEventListener('click', function(e) {
    var btn = e.target.closest('button[data-chip]');
    if (!btn) return;
    applyQuickDate(btn.dataset.chip);
  });

  txListEl.addEventListener('click', function(e) {
    if (!e.target.dataset || e.target.dataset.action !== 'delete-tx') return;
    var txEl = e.target.closest('.tx');
    if (!txEl) return;
    handleDeleteTx(parseInt(txEl.dataset.txId, 10));
  });

  navPrev.addEventListener('click', function() {
    viewMonth = shiftMonth(viewMonth, -1);
    renderStats();
  });
  navNext.addEventListener('click', function() {
    var next = shiftMonth(viewMonth, 1);
    if (next > currentMonthKey()) return;
    viewMonth = next;
    renderStats();
  });
  weeksEl.addEventListener('click', function(e) {
    var weekEl = e.target.closest('.week');
    if (!weekEl) return;
    weekEl.classList.toggle('collapsed');
  });

  titleEl.addEventListener('click', showHome);
  statsBtn.addEventListener('click', showStats);
  settingsBtn.addEventListener('click', showSettingsScreen);
  backBtnStats.addEventListener('click', showHome);
  backBtnSettings.addEventListener('click', showHome);

  function bindLimitInput(input, field) {
    input.addEventListener('blur', function() { handleLimitChange(field, input.value); });
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    });
  }
  bindLimitInput(monthLimitInput, 'monthLimit');
  bindLimitInput(weekLimitInput, 'weekLimit');

  function handleSettingsListChange(input) {
    if (!input || input.tagName !== 'INPUT') return;
    var catEl = input.closest('.settings-cat');
    if (!catEl) return;
    var id = parseInt(catEl.dataset.catId, 10);
    var cat = getCategoryById(id);
    if (!cat) return;

    if (input.classList.contains('emoji-input')) {
      handleSettingsCatChange(id, 'emoji', input.value);
    } else if (input.classList.contains('name-input')) {
      handleSettingsCatChange(id, 'name', input.value);
      if (!input.value.trim()) input.value = cat.name;
    } else if (input.classList.contains('kw-input')) {
      handleSettingsCatChange(id, 'keywords', input.value);
    } else if (input.classList.contains('budget-input')) {
      handleSettingsCatChange(id, 'budget', input.value);
      input.value = cat.budget;
    }
  }

  settingsCatListEl.addEventListener('blur', function(e) { handleSettingsListChange(e.target); }, true);
  settingsCatListEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); e.target.blur(); }
  });
  settingsCatListEl.addEventListener('click', function(e) {
    if (!e.target.classList.contains('settings-cat-delete')) return;
    var catEl = e.target.closest('.settings-cat');
    if (!catEl) return;
    handleDeleteCategory(parseInt(catEl.dataset.catId, 10));
  });

  addCatTrigger.addEventListener('click', function() {
    addCatTrigger.hidden = true;
    addCatPanel.hidden = false;
    addCatPanel.querySelector('input.name').focus();
  });
  addCatPanel.addEventListener('click', function(e) {
    var action = e.target.dataset && e.target.dataset.action;
    if (action === 'confirm') handleAddCategoryConfirm();
    else if (action === 'cancel') clearAddCatPanel();
  });
  addCatPanel.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); handleAddCategoryConfirm(); }
    else if (e.key === 'Escape') { e.preventDefault(); clearAddCatPanel(); }
  });

  dataActionsEl.addEventListener('click', function(e) {
    var action = e.target.dataset && e.target.dataset.action;
    if (action === 'export') handleExport();
    else if (action === 'import') importInput.click();
    else if (action === 'reset') handleReset();
  });
  importInput.addEventListener('change', function(e) {
    var file = e.target.files && e.target.files[0];
    handleImportFile(file);
    e.target.value = '';
  });

  // ===== Init =====
  state = loadStateLocal();
  viewMonth = currentMonthKey();
  renderHome();

  initCloudSync(function(remote) {
    cloudApplyingRemote = true;
    state = migrate(remote);
    saveStateLocal();
    cloudApplyingRemote = false;
    if (!screenHome.hidden) renderHome();
    if (!screenStats.hidden) renderStats();
    if (!screenSettings.hidden) renderSettings();
  });
})();
</script>
</body>
</html>
